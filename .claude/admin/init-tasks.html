<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Инициализация Dashboard</title>
</head>
<body>
    <h1>Инициализирую Dashboard...</h1>
    <p>Загружаю текущие задачи...</p>

    <script src="dashboard-api.js"></script>
    <script>
        // Добавить текущие задачи
        const initialTasks = [
            {
                type: 'Initialization',
                description: 'Создание ADMIN-ADMIN системы мониторинга',
                status: 'COMPLETED',
                actions: 'Инициализирована система, создана структура папок',
                result: 'admin_log.md, report.md созданы'
            },
            {
                type: 'Dashboard',
                description: 'Создание HTML Dashboard для визуализации',
                status: 'COMPLETED',
                actions: 'Разработан интерактивный dashboard с таблицей, статистикой и фильтрами',
                result: 'dashboard.html готов, localStorage для хранения данных'
            },
            {
                type: 'Chat Monitoring',
                description: 'Подключение к чату "Neo Тесты"',
                status: 'ACTIVE',
                actions: 'Прочитаны PROJECT_STATUS.md и WORK_WITH_CLAUDE.md, создан context.md',
                result: 'Контекст чата создан, мониторинг активирован. Ожидание: какие вопросы использовать для теста 33?'
            }
        ];

        // Очистить старые данные
        localStorage.removeItem('adminTasks');

        // Добавить новые задачи
        initialTasks.forEach(task => {
            AdminDashboardAPI.logTask(task);
        });

        // Перенаправить на dashboard
        document.body.innerHTML = `
            <h1>✅ Инициализация завершена!</h1>
            <p>Задачи загружены в localStorage</p>
            <p><a href="dashboard.html" style="font-size: 18px; color: blue;">← Вернуться к Dashboard</a></p>
        `;
    </script>
</body>
</html>
