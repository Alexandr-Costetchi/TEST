<title>Урок №1. Тест 2: Деятельность. Познание</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 10px; }
.container { width: 100%; max-width: 700px; background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 20px; }
.header { text-align: center; margin-bottom: 20px; }

.test-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #11998e, #38ef7d); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
.question-screen { display: none; }
.question-screen.active { display: block; }
.progress-bar { width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }

.progress-text { font-size: 12px; color: #888; text-align: center; margin-bottom: 14px; }
.question-text { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 8px; line-height: 1.5; }
.question-subtitle { font-size: 12px; color: #888; margin-bottom: 14px; font-style: italic; }

.option-label.checked { border-color: #11998e; background: #e8faf5; }
.option-checkbox { width: 18px; height: 18px; min-width: 18px; margin-right: 10px; margin-top: 2px; cursor: pointer; accent-color: #11998e; }
.option-text { font-size: 13px; color: #333; line-height: 1.4; }

.prev-btn { background: #f0f0f0; color: #333; }
.prev-btn:disabled { opacity: 0.5; }
.next-btn, .finish-btn { background: linear-gradient(135deg, #11998e, #38ef7d); color: white; }
.results-screen { display: none; text-align: center; }
.results-screen.active { display: block; }
.score-circle { width: 100px; height: 100px; background: linear-gradient(135deg, #11998e, #38ef7d); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 16px auto; font-size: 32px; font-weight: bold; color: white; }

.result-text { font-size: 14px; color: #666; margin: 8px 0; }

.review-qheader { padding: 9px 13px; font-size: 12px; font-weight: 600; color: #fff; line-height: 1.4; }

.review-qheader.incorrect { background: linear-gradient(135deg, #e53935, #b71c1c); }
.review-qbody { padding: 10px 13px; background: #fafafa; }
.correct-answer-box { background: #e8f5e9; border: 1.5px solid #43a047; border-radius: 7px; padding: 7px 11px; margin-bottom: 8px; font-size: 12px; color: #1b5e20; }
.correct-answer-box strong { display: block; margin-bottom: 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
.rev-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; margin-bottom: 8px; color: #666; }
.rev-opt { display: flex; gap: 7px; padding: 4px 7px; border-radius: 5px; margin-bottom: 3px; font-size: 12px; line-height: 1.4; }

.rev-opt.uw { background: #ffebee; color: #c62828; font-weight: 600; }
.rev-opt.ms { background: #fff3e0; color: #e65100; font-weight: 600; border-left: 3px solid #ff9800; }
.rev-opt.nn { color: #888; }
.back-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #11998e, #38ef7d); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px; }
</style>

<body>
<div class="container">

<script>
const questions = [
  {num:1, text:"Выберите верные суждения о деятельности человека и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные суждения", options:["Деятельность человека в отличие от поведения животных носит осознанный характер.","Трудовая деятельность безусловно является ведущей на протяжении всей жизни человека.","Компонентами структуры любой деятельности являются средства, мотивы, эмоции, принципы.","Культура формируется как результат преобразующей деятельности человека.","Учение как деятельность в отличие от коммуникативной предполагает использование понятий и терминов."], correct:[0,3]},
  {num:2, text:"Ниже приведён перечень терминов. Все они, за исключением двух, относятся к понятию «структура деятельности». Найдите два термина, «выпадающих» из общего ряда.", subtitle:"Выберите два лишних варианта", options:["субъект","объект","цель","авторитет","принципы","средства","результат"], correct:[3,4]},
  {num:3, text:"Ниже приведён перечень терминов. Все они, за исключением двух, относятся к понятию «виды деятельности». Найдите два термина, «выпадающих» из общего ряда.", subtitle:"Выберите два лишних варианта", options:["трудовая","естественная","учебная","созидательная","творческая","кадровая"], correct:[1,5]},
  {num:4, text:"Выберите верные суждения о творчестве как форме деятельности и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные суждения", options:["Творчество может проявляться как самостоятельный вид деятельности, направленный на создание нового, ранее не существовавшего.","Творческой деятельностью является любая целенаправленная деятельность человека.","Каждый человек обладает творческими способностями к той или иной деятельности.","Новизна является характеристикой творческой деятельности.","Целью творчества всегда является достижение практически полезного результата."], correct:[0,2,3]},
  {num:5, text:"Выберите верные суждения о деятельности и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные суждения", options:["Мотив в деятельности — это осознанное побуждение, основанное на потребностях, которое объясняет деятельность человека.","Эмоциональные действия связаны с убеждениями и моральными принципами.","Средства деятельности — это приёмы, методы, предметы и средства, используемые в процессе выполнения деятельности.","Объект, на который направлена практическая или теоретическая деятельность человека, называется субъектом деятельности.","Деятельность — это особая форма человеческой активности, которая регулируется сознанием, возникает из потребностей и направлена на изменение окружающего мира."], correct:[0,2,4]},
  {num:6, text:"Студент Егор готовится к сдаче экзамена. Выберите из предложенного перечня ситуации, в которых он выступал как субъект познавательной деятельности. Запишите цифры.", subtitle:"Выберите все верные варианты", options:["Егор выбрал учебники для подготовки к экзамену.","Егор сильно волновался в ночь перед экзаменом.","Егор забыл прийти на предэкзаменационную консультацию.","Егор подготовил краткие конспекты по основным вопросам.","С одногруппниками вслух проговорил ключевые положения каждого ответа."], correct:[0,3,4]},
  {num:7, text:"Ниже приведён перечень терминов. Все они, за исключением двух, относятся к теоретическому уровню научного познания. Найдите два термина, «выпадающих» из общего ряда.", subtitle:"Выберите два лишних варианта", options:["объяснение полученных данных","анкетирование","выдвижение гипотез","проведение измерений","построение системы аргументов","разработка концепции"], correct:[1,3]},
  {num:8, text:"Ниже приведён перечень терминов. Все они, за исключением двух, обозначают формы чувственного и рационального познания. Найдите два термина, «выпадающих» из общего ряда.", subtitle:"Выберите два лишних варианта", options:["дедукция","суждение","обобщение","ощущение","восприятие","представление"], correct:[0,2]},
  {num:9, text:"Ниже приведён перечень характеристик. Все они, за исключением двух, относятся к чувственному познанию. Найдите две характеристики, «выпадающие» из общего ряда.", subtitle:"Выберите два лишних варианта", options:["отображение целостного образа непосредственно воздействующего предмета","отражение отдельных свойств предметов, воспринимаемых в данный момент","определение пространственного расположения объекта","получение новых суждений на основе уже имеющихся","сохранение в памяти целостного образа предмета","обобщение и выделение общих существенных признаков класса предмета"], correct:[3,5]},
  {num:10, text:"Выберите верные суждения о чувственном познании и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные суждения", options:["Представление является формой рационального познания.","К формам чувственного познания относится восприятие.","В результате чувственного познания познающий субъект получает полное и исчерпывающее знание о предмете.","Чувственное познание в сравнении с рациональным глубже и точнее отражает объект исследования.","Исходным элементом чувственного познания является ощущение."], correct:[1,4]},
  {num:11, text:"Выберите верные суждения о рациональном познании и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные суждения", options:["Только человек обладает рациональным познанием.","Одной из форм рационального познания является понятие.","Рациональное познание в отличие от чувственного даёт полное и исчерпывающее знание о предмете.","Рациональное познание в отличие от чувственного способно привести к относительной истине.","Исходным элементом рационального познания является понятие."], correct:[0,1,4]},
  {num:12, text:"Одиннадцатиклассник Фёдор работает над рефератом о познавательной деятельности школьника. Какие характеристики из перечисленных ниже он может рассмотреть в своей работе? Запишите цифры.", subtitle:"Выберите все верные варианты", options:["Нацеленность на получение знания, нового для всего человечества.","Нацеленность на развитие собственных волевых качеств.","Нацеленность на приобретение новых знаний.","Нацеленность на развитие физических возможностей.","Нацеленность на овладение определёнными умениями."], correct:[2,4]},
  {num:13, text:"Выберите верные суждения о социальном познании и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные суждения", options:["В социальном познании невозможно применение научных методов.","В социальном познании, в отличие от познания в области естественных наук, для обозначения явлений и объектов используются специальные термины.","Субъект и объект социального познания совпадают.","Объект социального познания находится в постоянном развитии, что затрудняет процесс познания.","Возможности научного эксперимента в социальном познании крайне ограничены."], correct:[2,3,4]},
  {num:14, text:"Выберите верные суждения о социальном познании и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные суждения", options:["Исследователь, изучающий общество, использует в том числе и общенаучные методы и средства познания.","Социальные явления необходимо рассматривать в историческом и культурном аспектах.","Филология – одна из социальных наук.","Субъект и объект познания не совпадают.","Социальное познание может быть не только научным, но и обыденным."], correct:[0,1,4]},
  {num:15, text:"Выберите верные суждения о познании и истине. Запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные суждения", options:["Рациональное познание позволяет постигать сущность процессов, формировать собственные суждения и делать самостоятельные логически обоснованные выводы.","Конкретность истины определяется свойствами, закономерностями, условиями существования объекта познания.","Понятие как форма рационального познания характеризуется отражением отдельных свойств познаваемого объекта, непосредственно воздействующего на субъект познания.","К формам рационального познания относят понятие, представление, суждение.","Истина — это соответствие знаний, полученных субъектом познания, содержанию объекта познания."], correct:[0,1,4]},
  {num:16, text:"Ниже приведён перечень терминов. Все они, за исключением двух, обозначают формы чувственного и рационального познания. Найдите два термина, «выпадающих» из общего ряда.", subtitle:"Выберите два лишних варианта", options:["эксперимент","суждение","абстрагирование","ощущение","восприятие","представление"], correct:[0,2]},
  {num:17, text:"Ниже приведён перечень характеристик. Все они, за исключением двух, относятся к чувственному познанию. Найдите две характеристики, «выпадающие» из общего ряда.", subtitle:"Выберите два лишних варианта", options:["отображение целостного образа непосредственно воздействующего предмета","отражение внешних свойств предметов, воспринимаемых в данный момент","определение расположения объекта в пространстве","получение новых суждений на основе уже имеющихся","сохранение в памяти целостного образа предмета","обобщение и выделение общих существенных признаков класса предмета"], correct:[3,5]},
  {num:18, text:"Выберите верные суждения об обществе и его изменениях и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные суждения", options:["Реформа как форма социальных изменений, как правило, предполагает резкие качественные изменения общественных отношений.","Общество состоит из взаимосвязанных и взаимодействующих элементов.","Гуманистический критерий прогресса связывают с ростом производства и повышением производительности труда.","Общество является динамичной системой.","Возвращение к изжившим себя социальным структурам называют регрессом."], correct:[1,3,4]},
  {num:19, text:"Выберите верные суждения об обществе и его институтах и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные суждения", options:["Общество – это весь окружающий человека материальный мир.","Под обществом понимают всё население Земли, совокупность всех народов и стран.","Динамичность социальных институтов проявляется в их обособленности от природы.","Социальный институт – это исторически сложившаяся устойчивая форма организации совместной деятельности, направленной на удовлетворение базовых потребностей общества.","Социальные институты являются агентами социализации и социального контроля."], correct:[1,3,4]},
  {num:20, text:"Выберите верные суждения об обществе и социальных институтах и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные суждения", options:["Общество является постоянно развивающейся динамической системой.","Общественный прогресс характеризуется деградацией, возвратом к уже отжившим структурам и отношениям.","В широком смысле под обществом понимают обособившуюся от природы, но связанную с ней часть мира, включающую в себя способы взаимодействия и формы объединения людей.","Социальные институты выполняют функцию социализации человека.","Общество представляет собой закрытую систему, не взаимодействующую с внешней средой."], correct:[0,2,3]}
];

let currentIdx=0, userAnswers={};
function startTest(){const inp=document.getElementById('student-name');const name=inp.value.trim();if(!name){inp.style.borderColor='#e53935';inp.placeholder='Введите имя';return;}window._studentName=name;document.getElementById('name-screen').style.display='none';document.getElementById('question-screen').classList.add('active');showQ();}
function showQ(){const q=questions[currentIdx];const pct=Math.round((currentIdx+1)/questions.length*100);document.getElementById('progress-fill').style.width=pct+'%';document.getElementById('progress-text').textContent='Вопрос '+(currentIdx+1)+' из '+questions.length;document.getElementById('question-text').textContent='№'+q.num+'. '+q.text;document.getElementById('question-subtitle').textContent=q.subtitle;const c=document.getElementById('options-container');c.innerHTML='';q.options.forEach((opt,idx)=>{const checked=(userAnswers[currentIdx]||[]).includes(idx);const label=document.createElement('label');label.className='option-label'+(checked?' checked':'');label.innerHTML='<input type="checkbox" class="option-checkbox"'+(checked?' checked':'')+'><span class="option-text">'+(idx+1)+') '+opt+'</span>';label.querySelector('input').onchange=()=>{if(!userAnswers[currentIdx])userAnswers[currentIdx]=[];if(label.querySelector('input').checked){if(!userAnswers[currentIdx].includes(idx))userAnswers[currentIdx].push(idx);label.classList.add('checked');}else{userAnswers[currentIdx]=userAnswers[currentIdx].filter(x=>x!==idx);label.classList.remove('checked');}}; c.appendChild(label);});document.getElementById('prev-btn').disabled=currentIdx===0;document.getElementById('next-btn').style.display=currentIdx<questions.length-1?'block':'none';document.getElementById('finish-btn').style.display=currentIdx===questions.length-1?'block':'none';}
function nextQ(){if(currentIdx<questions.length-1){currentIdx++;showQ();}}
function prevQ(){if(currentIdx>0){currentIdx--;showQ();}}
function showResults(){let correct=0;const detailsArr=[];const rc=document.getElementById('review-container');rc.innerHTML='<div class="review-title">📝 Разбор ответов</div>';questions.forEach((q,idx)=>{const userAns=(userAnswers[idx]||[]).slice().sort((a,b)=>a-b);const corrAns=[...q.correct].sort((a,b)=>a-b);const isCorrect=JSON.stringify(userAns)===JSON.stringify(corrAns);if(isCorrect)correct++;detailsArr.push({q:q.num,chosen:userAns.map(i=>i+1).join(', ')||'—',correct:corrAns.map(i=>i+1).join(', '),status:isCorrect?'correct':'wrong'});const qDiv=document.createElement('div');qDiv.className='review-question';const hdr=document.createElement('div');hdr.className='review-qheader '+(isCorrect?'correct':'incorrect');hdr.textContent=(isCorrect?'✓ ':'✗ ')+'Вопрос '+q.num+': '+q.text.substring(0,80)+'...';qDiv.appendChild(hdr);const body=document.createElement('div');body.className='review-qbody';const ab=document.createElement('div');ab.className='correct-answer-box';ab.innerHTML='<strong>✅ Правильные ответы:</strong>'+q.correct.map(i=>(i+1)+') '+q.options[i]).join('; ');body.appendChild(ab);const leg=document.createElement('div');leg.className='rev-legend';leg.innerHTML='<span>✓ выбрал правильно</span><span>✗ выбрал неверно</span><span>! пропустил правильный</span>';body.appendChild(leg);q.options.forEach((opt,oi)=>{const uChose=(userAnswers[idx]||[]).includes(oi),isRight=q.correct.includes(oi);let cls='nn',icon='◦';if(uChose&&isRight){cls='uc';icon='✓';}else if(uChose&&!isRight){cls='uw';icon='✗';}else if(!uChose&&isRight){cls='ms';icon='!';}const row=document.createElement('div');row.className='rev-opt '+cls;row.innerHTML='<span>'+icon+'</span><span>'+(oi+1)+') '+opt+'</span>';body.appendChild(row);});qDiv.appendChild(body);rc.appendChild(qDiv);});const pct=Math.round(correct/questions.length*100);document.getElementById('score-circle').textContent=pct+'%';let msg='';if(pct===100)msg='🏆 Отлично! Все верно!';else if(pct>=70)msg='✅ Хороший результат!';else if(pct>=40)msg='📚 Нужно повторить материал';else msg='❌ Требуется серьёзная подготовка';document.getElementById('result-text').textContent=msg;document.getElementById('correct-count').textContent=correct+' из '+questions.length+' вопросов';(function(){const name=window._studentName||'Аноним';const ts=new Date().toLocaleString('ru-RU');fetch('https://script.google.com/macros/s/AKfycbxUNNmmBxwBNHr-hweNoGR8bGDW0CqHNvdSbdG20Sms3UVOiV_8yICDqysOZms-aMH1/exec',{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({name:name,testName:'Урок 1. Тест 2: Деятельность. Познание',date:ts,score_pct:pct,correct:correct,partial:0,wrong:questions.length-correct,total:questions.length,details:JSON.stringify(detailsArr)})}).catch(()=>{});})();document.getElementById('question-screen').classList.remove('active');document.getElementById('results-screen').classList.add('active');}
</script>
