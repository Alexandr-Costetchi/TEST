<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#667eea">
<title>Правовое регулирование. Тест 1</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 10px; }
.container { width: 100%; max-width: 700px; background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 20px; }
.header { text-align: center; margin-bottom: 20px; }
.header h1 { color: #333; font-size: 22px; margin-bottom: 6px; }
.header p { color: #666; font-size: 13px; }
.name-input { width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; margin: 10px 0 16px; transition: border-color 0.2s; font-family: inherit; }
.name-input:focus { border-color: #667eea; }
.test-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
.question-screen { display: none; }
.question-screen.active { display: block; }
.progress-bar { width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.3s; }
.progress-text { font-size: 12px; color: #888; text-align: center; margin-bottom: 14px; }
.question-text { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 8px; line-height: 1.5; }
.question-subtitle { font-size: 12px; color: #888; margin-bottom: 14px; font-style: italic; }
.options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 18px; }
.option-label { display: flex; align-items: flex-start; padding: 11px 12px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.option-label.checked { border-color: #667eea; background: #f0ebff; }
.option-checkbox { width: 18px; height: 18px; min-width: 18px; margin-right: 10px; margin-top: 2px; cursor: pointer; accent-color: #667eea; }
.option-text { font-size: 13px; color: #333; line-height: 1.4; }
.nav-buttons { display: flex; gap: 10px; }
.nav-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px; }
.prev-btn { background: #f0f0f0; color: #333; }
.prev-btn:disabled { opacity: 0.5; }
.next-btn, .finish-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
.results-screen { display: none; text-align: center; }
.results-screen.active { display: block; }
.score-circle { width: 100px; height: 100px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 16px auto; font-size: 32px; font-weight: bold; color: white; }
.result-title { font-size: 20px; font-weight: 600; color: #333; margin: 16px 0 8px; }
.result-text { font-size: 14px; color: #666; margin: 8px 0; }
.correct-count { font-size: 14px; color: #888; margin: 8px 0; }
.review-section { margin-top: 20px; text-align: left; }
.review-title { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 12px; text-align: center; padding-bottom: 8px; border-bottom: 2px solid #e0e0e0; }
.review-question { margin-bottom: 14px; border: 1px solid #e0e0e0; border-radius: 10px; overflow: hidden; }
.review-qheader { padding: 9px 13px; font-size: 12px; font-weight: 600; color: #fff; line-height: 1.4; }
.review-qheader.correct { background: linear-gradient(135deg, #43a047, #2e7d32); }
.review-qheader.incorrect { background: linear-gradient(135deg, #e53935, #b71c1c); }
.review-qbody { padding: 10px 13px; background: #fafafa; }
.correct-answer-box { background: #e8f5e9; border: 1.5px solid #43a047; border-radius: 7px; padding: 7px 11px; margin-bottom: 8px; font-size: 12px; color: #1b5e20; }
.correct-answer-box strong { display: block; margin-bottom: 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
.rev-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; margin-bottom: 8px; color: #666; }
.rev-opt { display: flex; gap: 7px; padding: 4px 7px; border-radius: 5px; margin-bottom: 3px; font-size: 12px; line-height: 1.4; }
.rev-opt.uc { background: #e8f5e9; color: #2e7d32; font-weight: 600; }
.rev-opt.uw { background: #ffebee; color: #c62828; font-weight: 600; }
.rev-opt.ms { background: #fff3e0; color: #e65100; font-weight: 600; border-left: 3px solid #ff9800; }
.rev-opt.nn { color: #888; }
.back-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px; }
</style>
</head>
<body>
<div class="container">
  <div id="name-screen">
    <div class="header">
      <h1>⚖️ Правовое регулирование. Тест 1</h1>
      <p>Система права. Нормы. Источники. Конституционный строй РФ</p>
    </div>
    <input type="text" id="student-name" class="name-input" placeholder="Имя и фамилия" autocomplete="name" onkeyup="if(event.key==='Enter')startTest()">
    <button class="test-btn" onclick="startTest()">▶ Начать тест (20 вопросов)</button>
  </div>
  <div class="question-screen" id="question-screen">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-text" id="progress-text"></div>
    <div class="question-text" id="question-text"></div>
    <div class="question-subtitle" id="question-subtitle"></div>
    <div class="options" id="options-container"></div>
    <div class="nav-buttons">
      <button class="nav-btn prev-btn" id="prev-btn" onclick="prevQ()">← Назад</button>
      <button class="nav-btn next-btn" id="next-btn" onclick="nextQ()">Дальше →</button>
      <button class="nav-btn finish-btn" id="finish-btn" onclick="showResults()">Завершить</button>
    </div>
  </div>
  <div class="results-screen" id="results-screen">
    <div class="result-title">Результаты теста</div>
    <div class="score-circle" id="score-circle">0%</div>
    <p class="result-text" id="result-text"></p>
    <div class="correct-count">Правильно: <strong id="correct-count">0/20</strong></div>
    <div id="review-container" class="review-section"></div>
    <button class="back-btn" onclick="location.reload()">↩ Пройти заново</button>
  </div>
</div>
<script>
const questions = [
  {num:1, text:"Выберите верные суждения о системе права и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Система права – это внутренняя структура права, которая выражается в единстве и согласованности составляющих его норм и одновременной дифференциации на отрасли и институты.","Отрасли материального права регламентируют исключительно процедурные, организационные вопросы (порядок разрешения споров, конфликтов, расследование и рассмотрение правонарушений и т. п.).","Гражданское право – отрасль права, регулирующая имущественные отношения в обществе, а также личные неимущественные отношения.","Уголовное право – отрасль права, состоящая из юридических норм, определяющих, какие общественно опасные деяния считаются преступными и какие наказания могут за них назначаться.","Административное право закрепляет форму правления, государственного (территориального) устройства, права и обязанности граждан, избирательное право и избирательную систему, порядок формирования, функции и взаимоотношения высших органов государственной власти."], correct:[0,2,3]},
  {num:2, text:"Выберите верные суждения о системе права. Запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Право защищает существующие общественные отношения.","Закон – это исторически выработанное обществом правило поведения, которое признано государством и гарантировано его принудительной силой.","Правовые нормы от других видов социальных норм отличает строгая формальная определённость содержащихся в них предписаний.","Отрасль права – это относительно самостоятельное подразделение системы права, состоящее из правовых норм, регулирующих качественно специфический вид общественных отношений.","Публично правовые отношения, в отличие от частноправовых, основаны на свободе договоров и юридическом равенстве участников."], correct:[0,2,3]},
  {num:3, text:"Выберите верные суждения о нормах права и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Норма права – это элемент системы права, представляющий собой совокупность правовых институтов, регулирующих качественно однородную сферу общественных отношений.","Нормы права представляют собой правила общеобязательного характера.","В зависимости от характера предписаний различают управомочивающие, запрещающие и обязывающие правовые нормы.","Нормы права обеспечиваются силой государственного принуждения.","Нормы права являются разновидностью социальных норм."], correct:[1,2,3,4]},
  {num:4, text:"Выберите верные суждения о нормативных правовых актах в РФ и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["По общему правилу закон в РФ обратной силы не имеет.","Кодексы являются нормативными правовыми актами.","Постановления Правительства РФ относятся к нормативным правовым актам субъектов РФ.","Президент РФ по вопросам, относящимся к его компетенции, издаёт указы.","Подзаконным актом называют нормативный правовой акт, принятый органом государственной власти в пределах его компетенции на основе и во исполнение закона."], correct:[0,1,3,4]},
  {num:5, text:"Выберите верные суждения о системе права и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Систему права составляют правотворчество, правоотношения и правоприменение.","Частное право регулирует межличностные отношения и не зависит от государства.","Система права – это внутреннее строение права, взаимосвязь его компонентов – норм, институтов и отраслей права.","Процессуальное право определяет порядок защиты материальных прав.","Публичное право – это совокупность отраслей, которые регулируют отношения господства и подчинения."], correct:[2,3,4]},
  {num:6, text:"Выберите верные суждения о системе права и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Система права – это единство правотворчества, правоприменения и правовой культуры граждан.","Отрасль права регулирует значительную сферу однородных общественных отношений.","Совокупность правовых норм, которые непосредственно регулируют социальные отношения в разных сферах общественной жизни, относят к процессуальному праву.","К отраслям частного права чаще всего принято относить гражданское, трудовое и семейное право.","В систему права входят правовые нормы, институты права и отрасли права."], correct:[1,3,4]},
  {num:7, text:"Выберите верные суждения о системе права. Запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Особенностью отрасли гражданского права является регулирование отношений между родственниками.","Процессуальное право регулирует порядок, процедуру осуществления прав и обязанностей сторон.","Отрасль права – это относительно самостоятельное подразделение системы права, состоящее из правовых норм, регулирующих качественно специфический вид общественных отношений.","Правовые нормы от других видов социальных норм отличает строгая формальная определённость содержащихся в них предписаний.","Публично-правовые отношения, в отличие от частноправовых, основаны на свободе договоров и юридическом равенстве участников."], correct:[1,2,3]},
  {num:8, text:"Выберите верные суждения об отраслях права и судопроизводстве и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Процессуальные отрасли права входят в систему материального права.","Административно-процессуальное право регулирует рассмотрение в суде споров при участии присяжных заседателей.","Субъектами административной ответственности могут быть граждане, достигшие шестнадцатилетнего возраста, должностные лица и юридические лица.","Независимость, гласность, коллегиальность, состязательность являются принципами конституционного судопроизводства.","Процессуальные отрасли права составляют основу осуществления правосудия."], correct:[2,3,4]},
  {num:9, text:"Ниже приведён ряд терминов. Все они, за исключением двух, обозначают отрасли публичного права. Найдите два термина, «выпадающих» из общего ряда, и запишите в таблицу цифры, под которыми они указаны.", subtitle:"Найдите два лишних термина", options:["административное право","семейное право","уголовное право","процессуальное право","гражданское право","конституционное право"], correct:[1,4]},
  {num:10, text:"Ниже приведён перечень терминов. Все они, за исключением двух, относятся к субъектам законодательной инициативы в РФ. Найдите два термина, «выпадающих» из общего ряда, и запишите в таблицу цифры, под которыми они указаны.", subtitle:"Найдите два лишних термина", options:["Президент Российской Федерации","депутаты Государственной Думы Российской Федерации","Правительство Российской Федерации","органы местного самоуправления","политические партии","сенаторы Совета Федерации Федерального Собрания РФ"], correct:[3,4]},
  {num:11, text:"Выберите верные суждения о правоотношении и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Участниками правоотношений могут быть только совершеннолетние граждане.","В структуру правоотношения входят субъекты, объект и содержание.","Одним из участников правоотношений всегда является государство.","Правоотношение – это социальное отношение, которое регулируется нормой права.","Правоотношение охраняется государством."], correct:[1,3,4]},
  {num:12, text:"Выберите верные суждения о правовых отношениях и их субъектах и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Правовые отношения – это общественные отношения, которые регулируются моральными и правовыми нормами.","Одним из субъектов правовых отношений всегда является государство.","Субъекты правовых отношений имеют субъективные права и несут юридические обязанности.","Правовые отношения, связанные с расследованием правонарушений, рассмотрением и разрешением уголовных, гражданских, административных дел, образуют процессуальное право.","В структуре правового отношения выделяют субъектов, объекты и содержание."], correct:[2,3,4]},
  {num:13, text:"Ниже приведён перечень терминов. Все они, за исключением двух, обозначают виды юридической ответственности. Найдите два термина, «выпадающих» из общего ряда, и запишите в таблицу цифры, под которыми они указаны.", subtitle:"Найдите два лишних термина", options:["материальная","дисциплинарная","судебная","уголовная","досрочная","административная"], correct:[2,4]},
  {num:14, text:"Выберите верные суждения о праве в системе социальных норм и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Сфера действия права шире, чем норм морали.","Только нормы права исходят от государства и являются официальным выражением его воли.","Нормы права не являются формально определёнными.","Одним из признаков права как социальной нормы является его общеобязательный характер.","Нормы права являются государственным регулятором общественных отношений."], correct:[1,3,4]},
  {num:15, text:"Выберите верные суждения об источниках права и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Источники права – это способы выражения и закрепления правовых норм.","Нормативно-правовой акт – самый древний по времени возникновения источник права.","К нормативно-правовым актам относятся законы и подзаконные акты.","Решение суда по какому-либо делу, которое становится образцом для решения других подобных дел, называется судебным прецедентом.","Примером правового обычая является текст присяги, принимаемой Президентом РФ при его вступлении в должность."], correct:[0,2,3]},
  {num:16, text:"Выберите в приведённом списке положения, характеризующие основы конституционного строя Российской Федерации, и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Уголовной ответственности подлежит лицо, достигшее ко времени совершения преступления 16-летнего возраста.","Преступлением, совершённым умышленно, признаётся деяние, совершённое с прямым или косвенным умыслом.","Гражданин РФ не может быть лишён своего гражданства или права изменить его.","Коллективный договор – правовой акт, регулирующий социально-трудовые отношения в организации или у индивидуального предпринимателя и заключаемый работниками и работодателем в лице их представителей.","Органы законодательной, исполнительной и судебной власти самостоятельны."], correct:[2,4]},

let currentIdx = 0;
let userAnswers = {};

function startTest() {
  const inp = document.getElementById('student-name');
  const name = inp.value.trim();
  if (!name) { inp.style.borderColor='#e53935'; inp.placeholder='Введите имя'; return; }
  window._studentName = name;
  document.getElementById('name-screen').style.display = 'none';
  document.getElementById('question-screen').classList.add('active');
  showQ();
}

function showQ() {
  const q = questions[currentIdx];
  const pct = Math.round((currentIdx+1)/questions.length*100);
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-text').textContent = 'Вопрос '+(currentIdx+1)+' из '+questions.length;
  document.getElementById('question-text').textContent = '№'+q.num+'. '+q.text;
  document.getElementById('question-subtitle').textContent = q.subtitle;
  const c = document.getElementById('options-container');
  c.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const checked = (userAnswers[currentIdx]||[]).includes(idx);
    const label = document.createElement('label');
    label.className = 'option-label'+(checked?' checked':'');
    label.innerHTML = '<input type="checkbox" class="option-checkbox"'+(checked?' checked':'')+'><span class="option-text">'+(idx+1)+') '+opt+'</span>';
    label.querySelector('input').onchange = () => {
      if (!userAnswers[currentIdx]) userAnswers[currentIdx]=[];
      if (label.querySelector('input').checked) { if(!userAnswers[currentIdx].includes(idx)) userAnswers[currentIdx].push(idx); label.classList.add('checked'); }
      else { userAnswers[currentIdx]=userAnswers[currentIdx].filter(x=>x!==idx); label.classList.remove('checked'); }
    };
    c.appendChild(label);
  });
  document.getElementById('prev-btn').disabled = currentIdx===0;
  document.getElementById('next-btn').style.display = currentIdx<questions.length-1?'block':'none';
  document.getElementById('finish-btn').style.display = currentIdx===questions.length-1?'block':'none';
}

function nextQ() { if(currentIdx<questions.length-1){currentIdx++;showQ();} }
function prevQ() { if(currentIdx>0){currentIdx--;showQ();} }

function showResults() {
  let correct=0;
  const rc=document.getElementById('review-container');
  rc.innerHTML='<div class="review-title">📝 Разбор ответов</div>';
  questions.forEach((q,idx) => {
    const userAns=(userAnswers[idx]||[]).slice().sort((a,b)=>a-b);
    const corrAns=q.correct.slice().sort((a,b)=>a-b);
    const isCorrect=JSON.stringify(userAns)===JSON.stringify(corrAns);
    if(isCorrect) correct++;
    const div=document.createElement('div');
    div.className='review-question';
    const corrNums=corrAns.map(i=>i+1).join(', ');
    div.innerHTML='<div class="review-qheader '+(isCorrect?'correct':'incorrect')+'">'+(isCorrect?'✅':'❌')+' №'+q.num+'. '+q.text+'</div>'+
      '<div class="review-qbody"><div class="correct-answer-box"><strong>Правильный ответ:</strong>'+corrNums+'</div>';
    const legend=document.createElement('div');
    legend.className='rev-legend';
    legend.innerHTML='<span>🟢 верно выбран</span><span>🔴 лишний</span><span>🟡 пропущен</span>';
    div.querySelector('.review-qbody').appendChild(legend);
    q.options.forEach((opt,oi)=>{
      const inUser=userAns.includes(oi), inCorr=corrAns.includes(oi);
      let cls='nn', icon='';
      if(inUser&&inCorr){cls='uc';icon='🟢';}
      else if(inUser&&!inCorr){cls='uw';icon='🔴';}
      else if(!inUser&&inCorr){cls='ms';icon='🟡';}
      if(cls!=='nn'||true){
        const od=document.createElement('div');
        od.className='rev-opt '+cls;
        od.textContent=icon+' '+(oi+1)+') '+opt;
        div.querySelector('.review-qbody').appendChild(od);
      }
    });
    div.querySelector('.review-qbody').innerHTML+='</div>';
    rc.appendChild(div);
  });
  const pct=Math.round(correct/questions.length*100);
  document.getElementById('score-circle').textContent=pct+'%';
  document.getElementById('correct-count').textContent=correct+'/'+questions.length;
  let msg='';
  if(pct>=90)msg='Отлично! Превосходный результат!';
  else if(pct>=70)msg='Хорошо! Продолжайте в том же духе!';
  else if(pct>=50)msg='Удовлетворительно. Стоит повторить материал.';
  else msg='Нужно повторить тему.';
  document.getElementById('result-text').textContent=window._studentName+', '+msg;
  document.getElementById('question-screen').classList.remove('active');
  document.getElementById('results-screen').classList.add('active');
}
</script>
