<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#667eea">
<title>Правовое регулирование. Тест 3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 10px; }
.container { width: 100%; max-width: 700px; background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 20px; }
.header { text-align: center; margin-bottom: 20px; }
.header h1 { color: #333; font-size: 22px; margin-bottom: 6px; }
.header p { color: #666; font-size: 13px; }
.name-input { width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; margin: 10px 0 16px; transition: border-color 0.2s; font-family: inherit; }
.name-input:focus { border-color: #667eea; }
.test-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
.question-screen { display: none; }
.question-screen.active { display: block; }
.progress-bar { width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.3s; }
.progress-text { font-size: 12px; color: #888; text-align: center; margin-bottom: 14px; }
.question-text { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 8px; line-height: 1.5; }
.question-subtitle { font-size: 12px; color: #888; margin-bottom: 14px; font-style: italic; }
.options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 18px; }
.option-label { display: flex; align-items: flex-start; padding: 11px 12px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.option-label.checked { border-color: #667eea; background: #f0ebff; }
.option-checkbox { width: 18px; height: 18px; min-width: 18px; margin-right: 10px; margin-top: 2px; cursor: pointer; accent-color: #667eea; }
.option-text { font-size: 13px; color: #333; line-height: 1.4; }
.nav-buttons { display: flex; gap: 10px; }
.nav-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px; }
.prev-btn { background: #f0f0f0; color: #333; }
.prev-btn:disabled { opacity: 0.5; }
.next-btn, .finish-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
.results-screen { display: none; text-align: center; }
.results-screen.active { display: block; }
.score-circle { width: 100px; height: 100px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 16px auto; font-size: 32px; font-weight: bold; color: white; }
.result-title { font-size: 20px; font-weight: 600; color: #333; margin: 16px 0 8px; }
.result-text { font-size: 14px; color: #666; margin: 8px 0; }
.correct-count { font-size: 14px; color: #888; margin: 8px 0; }
.review-section { margin-top: 20px; text-align: left; }
.review-title { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 12px; text-align: center; padding-bottom: 8px; border-bottom: 2px solid #e0e0e0; }
.review-question { margin-bottom: 14px; border: 1px solid #e0e0e0; border-radius: 10px; overflow: hidden; }
.review-qheader { padding: 9px 13px; font-size: 12px; font-weight: 600; color: #fff; line-height: 1.4; }
.review-qheader.correct { background: linear-gradient(135deg, #43a047, #2e7d32); }
.review-qheader.incorrect { background: linear-gradient(135deg, #e53935, #b71c1c); }
.review-qbody { padding: 10px 13px; background: #fafafa; }
.correct-answer-box { background: #e8f5e9; border: 1.5px solid #43a047; border-radius: 7px; padding: 7px 11px; margin-bottom: 8px; font-size: 12px; color: #1b5e20; }
.correct-answer-box strong { display: block; margin-bottom: 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
.rev-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; margin-bottom: 8px; color: #666; }
.rev-opt { display: flex; gap: 7px; padding: 4px 7px; border-radius: 5px; margin-bottom: 3px; font-size: 12px; line-height: 1.4; }
.rev-opt.uc { background: #e8f5e9; color: #2e7d32; font-weight: 600; }
.rev-opt.uw { background: #ffebee; color: #c62828; font-weight: 600; }
.rev-opt.ms { background: #fff3e0; color: #e65100; font-weight: 600; border-left: 3px solid #ff9800; }
.rev-opt.nn { color: #888; }
.back-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px; }
</style>
</head>
<body>
<div class="container">
  <div id="name-screen">
    <div class="header">
      <h1>⚖️ Правовое регулирование. Тест 3</h1>
      <p>Семья. Трудовое право. Налоги. Образование. Судопроизводство</p>
    </div>
    <input type="text" id="student-name" class="name-input" placeholder="Имя и фамилия" autocomplete="name" onkeyup="if(event.key==='Enter')startTest()">
    <button class="test-btn" onclick="startTest()">▶ Начать тест (20 вопросов)</button>
  </div>
  <div class="question-screen" id="question-screen">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-text" id="progress-text"></div>
    <div class="question-text" id="question-text"></div>
    <div class="question-subtitle" id="question-subtitle"></div>
    <div class="options" id="options-container"></div>
    <div class="nav-buttons">
      <button class="nav-btn prev-btn" id="prev-btn" onclick="prevQ()">← Назад</button>
      <button class="nav-btn next-btn" id="next-btn" onclick="nextQ()">Дальше →</button>
      <button class="nav-btn finish-btn" id="finish-btn" onclick="showResults()">Завершить</button>
    </div>
  </div>
  <div class="results-screen" id="results-screen">
    <div class="result-title">Результаты теста</div>
    <div class="score-circle" id="score-circle">0%</div>
    <p class="result-text" id="result-text"></p>
    <div class="correct-count">Правильно: <strong id="correct-count">0/20</strong></div>
    <div id="review-container" class="review-section"></div>
    <button class="back-btn" onclick="location.reload()">↩ Пройти заново</button>
  </div>
</div>
<script>
const questions = [
  {num:41, text:"Выберите верные суждения о правах и обязанностях детей и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["К имущественным правам ребёнка относится право владеть и пользоваться имуществом родителей при совместном проживании с ними.","В случае расторжения брака ребёнок имеет право общаться с обоими родителями и их родственниками.","Ребёнок имеет право обратиться в суд для защиты своих прав по достижении 14 лет.","До достижения совершеннолетия ребёнок не имеет права собственности на полученное по наследству имущество и доходы от него.","Совершеннолетние трудоспособные дети обязаны содержать своих нетрудоспособных родителей, нуждающихся в помощи, и заботиться о них."], correct:[1,2,4]},
  {num:42, text:"Выберите верные суждения о правах и обязанностях супругов, заключивших брачный договор, и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Брачным договором супруги вправе ввести режим раздельной собственности на всё имущество или на его отдельные виды.","Один из супругов может отказаться от исполнения заключённого брачного договора.","По соглашению супругов брачный договор может быть изменён или расторгнут в любое время.","Брачный договор не может включать положения, ограничивающие право нетрудоспособного нуждающегося супруга на получение содержания.","Брачный договор регулирует права и обязанности супругов в отношении детей."], correct:[0,2,3]},
  {num:43, text:"Выберите верные суждения о брачном договоре и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Брачный договор представляет законный режим имущества супругов.","Брачный договор заключается в письменной форме и подлежит нотариальному удостоверению.","Супруги вправе определить в брачном договоре свои права и обязанности по отношению к детям.","Брачный договор не может содержать условий, которые ставят одного из супругов в крайне неблагоприятное положение.","Брачный договор могут заключить как вступающие в брак лица, так и супруги в любое время в период брака."], correct:[1,3,4]},
  {num:44, text:"Студент работает над рефератом «Требования к работнику как участнику трудовой деятельности». Какие требования из перечисленных ниже он может рассмотреть в своей работе? Запишите цифры, под которыми эти требования указаны.", subtitle:"Выберите все верные варианты", options:["квалификация, соответствующая характеру труда","соблюдение законов о труде","соблюдение правил внутреннего распорядка","обеспечение надлежащих условий труда","соответствующий уровень заработной платы","обеспечение социальных гарантий"], correct:[0,1,2]},
  {num:45, text:"Егору Ивановичу 54 года, он успешно прошёл собеседование при приёме на работу. Но работодатель отдал предпочтение другому претенденту, менее успешно прошедшему собеседование только потому, что он моложе Егора Ивановича на десять лет. Найдите в приведённом списке позиции, соответствующие правовому контексту описанной ситуации в рамках российского законодательства, и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["заявление в полицию","дискриминация","иск в суд","трудовое право","уголовное право","дисциплинарный проступок"], correct:[1,2,3]},
  {num:46, text:"Найдите в списке юридические основания расторжения трудового договора по инициативе работодателя и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["В связи с падением спроса на продукцию предприятие было вынуждено сократить численность сотрудников на 15%.","В результате несчастного случая мастер-часовщик фирмы по производству часов частично потерял зрение, и руководство фирмы расторгло с ним трудовой договор.","Работодатель узнал, что работник разгласил сведения, составляющие коммерческую тайну, которыми он располагал в силу должностных обязательств.","Проведённая аттестация сотрудников академического института показала, что уровень квалификации ряда научных сотрудников не соответствует требованиям квалификационной характеристики.","Женщина ушла в декретный отпуск, и основываясь на том, что она не сможет длительное время исполнять свои функциональные обязанности на фирме, руководство приняло решение об ее увольнении."], correct:[0,2,3]},
  {num:47, text:"Ниже приведён перечень терминов. Все они, за исключением двух, являются примерами прав работника. Найдите два термина, «выпадающих» из общего ряда, и запишите в таблицу цифры, под которыми они указаны.", subtitle:"Найдите два лишних термина", options:["заключить трудовой договор","ежегодный оплачиваемый отпуск","получать заработную плату своевременно и в полном объёме","иметь полную и достоверную информацию об условиях труда","добросовестно исполнять свои трудовые обязанности, возложенные на него трудовым договором","бережно относиться к имуществу работодателя"], correct:[4,5]},
  {num:48, text:"Укажите, для каких категорий лиц не устанавливается испытание при приёме на работу и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["беременных женщин","уволенных в запас военнослужащих срочной службы","лиц с высшим образованием","лиц, не достигших 18 лет","лиц, окончивших профессиональное образовательное учреждение и впервые поступающих на работу по специальности в течение года после окончания учебного заведения","лиц, поменявших место жительства"], correct:[0,3,4]},
  {num:49, text:"Ниже приведён перечень прав и обязанностей. Все они, за исключением двух, относятся только к правам работника. Найдите два термина, «выпадающих» из общего ряда, и запишите в таблицу цифры, под которыми они указаны.", subtitle:"Найдите два лишних термина", options:["бережливость","получать заработную плату своевременно и в полном объёме","трудиться в условиях, отвечающих требованиям безопасности и гигиены","добросовестность","иметь полную достоверную информацию об условиях труда","заключать трудовой договор"], correct:[0,3]},
  {num:50, text:"Выберите верные суждения о налогах и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Налоги наполняют государственный бюджет и позволяют оплачивать расходы государства.","К косвенным налогам относят налог на доходы физических лиц.","Налоги направляются на поддержку малообеспеченных слоёв общества за счёт частичного перераспределения средств.","Прямые налоги, в отличие от косвенных, носят обязательный характер.","Прямые налоги изымаются непосредственно из дохода налогоплательщика."], correct:[0,2,4]},
  {num:51, text:"Наталья Петровна, 35-летняя гражданка России, владелица сети кофеен, имеет в собственности трёхкомнатную квартиру и автомобиль. Она вступила в наследство, получив от двоюродного дяди садовый участок с домом. Затем она вышла замуж и уехала жить к мужу в загородный дом. Какие из перечисленных ниже налогов и сборов, своевременно и в полном объёме уплаченных Натальей Петровной и её предприятиями, относятся к федеральным налогам и сборам? Запишите цифры, под которыми указаны федеральные налоги и сборы.", subtitle:"Выберите все верные варианты", options:["налог на имущество физических лиц","транспортный налог","земельный налог","налог на имущество организаций","государственная пошлина","налог на доходы физических лиц"], correct:[4,5]},
  {num:52, text:"Выберите верные суждения о налогообложении и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Мажоритарное налогообложение означает, что ставка налога зависит от величины дохода.","При прогрессивном налогообложении с высоких доходов взимается больший процент, чем с низких.","При пропорциональной системе по мере возрастания дохода увеличивается ставка налога.","При регрессивном налогообложении семья с меньшими доходами платит больший процент от своих доходов, чем семья с высокими доходами.","При профицитном налогообложении могут взиматься одинаковые ставки налога со всех налогоплательщиков."], correct:[1,3]},
  {num:53, text:"В соответствии с Законом об образовании в Российской Федерации система общего образования в нашей стране включает несколько уровней. Укажите общие черты, присущие начальному общему и основному общему образованию в нашей стране. Запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["оба уровня завершаются государственной итоговой аттестацией","обучение носит предметный характер","имеют одинаковую продолжительность обучения","обучение нацелено на формирование знаний и способов деятельности","используются цифровые технологии","обучение в классе сочетается с внеклассной работой и дополнительным образованием"], correct:[1,3,4,5]},
  {num:54, text:"В рамках национального проекта «Образование» в нашей стране было сделано многое для развития системы общего и профессионального образования. Чем характеризуется система образования в Российской Федерации? Запишите цифры, под которыми эти характеристики указаны.", subtitle:"Выберите все верные варианты", options:["среднее образование даёт только общеобразовательная школа","отбор в высшие учебные заведения осуществляется на конкурсной основе","федеральные государственные образовательные стандарты предусматривают использование проектной деятельности","первым уровнем образования является основная школа","цифровые технологии всё шире используются в школьном образовании","государственная итоговая аттестация проводится по всем учебным предметам"], correct:[1,2,4]},
  {num:55, text:"Выберите в приведённом ниже списке положения, характеризующие конституционный статус граждан Российской Федерации, и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["каждый имеет право на образование","каждому гарантируется свобода творчества","защита Отечества - долг и обязанность гражданина","заключение брачного договора","соблюдение трудовой дисциплины"], correct:[0,1,2]},
  {num:56, text:"Ниже приведён перечень терминов. Все они, за исключением двух, относятся к политическим правам граждан Российской Федерации. Найдите два термина, «выпадающих» из общего ряда, и запишите в таблицу цифры, под которыми они указаны.", subtitle:"Найдите два лишних термина", options:["право частной собственности","право участвовать в управлении делами государства","право на образование","право быть избранными в органы государственной власти","право на объединение","право проводить собрания, митинги и демонстрации"], correct:[0,2]},

let currentIdx = 0;
let userAnswers = {};

function startTest() {
  const inp = document.getElementById('student-name');
  const name = inp.value.trim();
  if (!name) { inp.style.borderColor='#e53935'; inp.placeholder='Введите имя'; return; }
  window._studentName = name;
  document.getElementById('name-screen').style.display = 'none';
  document.getElementById('question-screen').classList.add('active');
  showQ();
}

function showQ() {
  const q = questions[currentIdx];
  const pct = Math.round((currentIdx+1)/questions.length*100);
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-text').textContent = 'Вопрос '+(currentIdx+1)+' из '+questions.length;
  document.getElementById('question-text').textContent = '№'+q.num+'. '+q.text;
  document.getElementById('question-subtitle').textContent = q.subtitle;
  const c = document.getElementById('options-container');
  c.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const checked = (userAnswers[currentIdx]||[]).includes(idx);
    const label = document.createElement('label');
    label.className = 'option-label'+(checked?' checked':'');
    label.innerHTML = '<input type="checkbox" class="option-checkbox"'+(checked?' checked':'')+'><span class="option-text">'+(idx+1)+') '+opt+'</span>';
    label.querySelector('input').onchange = () => {
      if (!userAnswers[currentIdx]) userAnswers[currentIdx]=[];
      if (label.querySelector('input').checked) { if(!userAnswers[currentIdx].includes(idx)) userAnswers[currentIdx].push(idx); label.classList.add('checked'); }
      else { userAnswers[currentIdx]=userAnswers[currentIdx].filter(x=>x!==idx); label.classList.remove('checked'); }
    };
    c.appendChild(label);
  });
  document.getElementById('prev-btn').disabled = currentIdx===0;
  document.getElementById('next-btn').style.display = currentIdx<questions.length-1?'block':'none';
  document.getElementById('finish-btn').style.display = currentIdx===questions.length-1?'block':'none';
}

function nextQ() { if(currentIdx<questions.length-1){currentIdx++;showQ();} }
function prevQ() { if(currentIdx>0){currentIdx--;showQ();} }

function showResults() {
  let correct=0;
  const rc=document.getElementById('review-container');
  rc.innerHTML='<div class="review-title">📝 Разбор ответов</div>';
  questions.forEach((q,idx) => {
    const userAns=(userAnswers[idx]||[]).slice().sort((a,b)=>a-b);
    const corrAns=q.correct.slice().sort((a,b)=>a-b);
    const isCorrect=JSON.stringify(userAns)===JSON.stringify(corrAns);
    if(isCorrect) correct++;
    const div=document.createElement('div');
    div.className='review-question';
    const corrNums=corrAns.map(i=>i+1).join(', ');
    div.innerHTML='<div class="review-qheader '+(isCorrect?'correct':'incorrect')+'">'+(isCorrect?'✅':'❌')+' №'+q.num+'. '+q.text+'</div>'+
      '<div class="review-qbody"><div class="correct-answer-box"><strong>Правильный ответ:</strong>'+corrNums+'</div>';
    const legend=document.createElement('div');
    legend.className='rev-legend';
    legend.innerHTML='<span>🟢 верно выбран</span><span>🔴 лишний</span><span>🟡 пропущен</span>';
    div.querySelector('.review-qbody').appendChild(legend);
    q.options.forEach((opt,oi)=>{
      const inUser=userAns.includes(oi), inCorr=corrAns.includes(oi);
      let cls='nn', icon='';
      if(inUser&&inCorr){cls='uc';icon='🟢';}
      else if(inUser&&!inCorr){cls='uw';icon='🔴';}
      else if(!inUser&&inCorr){cls='ms';icon='🟡';}
      if(cls!=='nn'||true){
        const od=document.createElement('div');
        od.className='rev-opt '+cls;
        od.textContent=icon+' '+(oi+1)+') '+opt;
        div.querySelector('.review-qbody').appendChild(od);
      }
    });
    div.querySelector('.review-qbody').innerHTML+='</div>';
    rc.appendChild(div);
  });
  const pct=Math.round(correct/questions.length*100);
  document.getElementById('score-circle').textContent=pct+'%';
  document.getElementById('correct-count').textContent=correct+'/'+questions.length;
  let msg='';
  if(pct>=90)msg='Отлично! Превосходный результат!';
  else if(pct>=70)msg='Хорошо! Продолжайте в том же духе!';
  else if(pct>=50)msg='Удовлетворительно. Стоит повторить материал.';
  else msg='Нужно повторить тему.';
  document.getElementById('result-text').textContent=window._studentName+', '+msg;
  (function(){
    var name=window._studentName||'Аноним';
    var ts=new Date().toLocaleString('ru-RU');
    fetch('https://script.google.com/macros/s/AKfycbxUNNmmBxwBNHr-hweNoGR8bGDW0CqHNvdSbdG20Sms3UVOiV_8yICDqysOZms-aMH1/exec',{
      method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({name:name,testName:'Правовое регулирование. Тест 3',date:ts,score_pct:pct,correct:correct,partial:0,wrong:questions.length-correct,total:questions.length,details:JSON.stringify(detailsArr)})
    }).catch(function(){});
  })();
  document.getElementById('question-screen').classList.remove('active');
  document.getElementById('results-screen').classList.add('active');
}
</script>
