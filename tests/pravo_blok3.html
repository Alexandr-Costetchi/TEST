<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1b4f72">
<title>Право Блок 3 — ЕГЭ</title>
<style>
:root{--primary:#1b4f72;--primary-light:#2874a6;--accent:#d4a017;--success:#1e8449;--danger:#c0392b;--bg:#f4f6f9;--card:#fff;--border:#d5d8dc;--muted:#717d7e;--radius:10px;}
*{margin:0;padding:0;box-sizing:border-box;}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);min-height:100vh;color:#2c3e50;}
header{background:var(--primary);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;}
.header-icon{width:40px;height:40px;background:rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0;}
header h1{font-size:1.1rem;line-height:1.3;}header p{font-size:.78rem;opacity:.8;margin-top:2px;}
#progress-wrap{height:4px;background:#d5d8dc;}#progress-bar{height:100%;width:0%;background:var(--accent);transition:width .3s;}
.screen{display:none;}.screen.active{display:block;}.container{max-width:720px;margin:0 auto;padding:24px 16px 64px;}
.welcome-card{background:var(--card);border-radius:var(--radius);padding:32px 28px;box-shadow:0 2px 12px rgba(0,0,0,.07);text-align:center;}
.welcome-card h2{font-size:1.5rem;color:var(--primary);margin-bottom:8px;}
.welcome-card .subtitle{color:var(--muted);font-size:.92rem;margin-bottom:24px;line-height:1.5;}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
.info-box{background:var(--bg);border-radius:8px;padding:12px 8px;font-size:.82rem;color:var(--muted);}
.info-box strong{display:block;font-size:1.35rem;color:var(--primary);margin-bottom:2px;}
.name-group{text-align:left;margin-bottom:24px;}.name-group label{display:block;font-weight:600;margin-bottom:7px;font-size:.92rem;}
.name-group input{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:8px;font-size:1rem;outline:none;transition:border-color .2s;}
.name-group input:focus{border-color:var(--primary-light);}
.btn{display:inline-block;padding:13px 32px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s,transform .1s;}
.btn:hover{background:var(--primary-light);}.btn:active{transform:scale(.98);}
.btn-accent{background:var(--accent);}.btn-accent:hover{background:#b8860b;}
.progress-label{font-size:.82rem;color:var(--muted);margin-bottom:16px;}
.q-card{background:var(--card);border-radius:var(--radius);border-left:4px solid var(--border);padding:20px 22px;margin-bottom:14px;box-shadow:0 1px 5px rgba(0,0,0,.05);}
.q-card.answered{border-left-color:var(--primary-light);}.q-card.q-correct{border-left-color:var(--success);}.q-card.q-partial{border-left-color:var(--accent);}.q-card.q-wrong{border-left-color:var(--danger);}
.q-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}
.q-num{min-width:30px;height:30px;background:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.88rem;color:var(--primary);flex-shrink:0;}
.q-text{font-size:.94rem;line-height:1.55;font-weight:500;}.options{list-style:none;}.options li{margin-bottom:7px;}
.option-label{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;cursor:pointer;font-size:.9rem;line-height:1.45;transition:background .15s,border-color .15s;user-select:none;}
.option-label:hover{background:#eaf2fb;border-color:var(--primary-light);}.option-label.selected{background:#eaf2fb;border-color:var(--primary);}
.res-correct-chosen{background:#d5f5e3!important;border-color:var(--success)!important;}.res-wrong-chosen{background:#fde8e8!important;border-color:var(--danger)!important;}.res-correct-missed{background:#fef9e7!important;border-color:var(--accent)!important;}
.q-comment{background:#fef9e7;border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.85rem;margin-top:10px;line-height:1.5;color:#555;}
.score-circle{width:110px;height:110px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px;font-weight:800;color:#fff;}
.score-circle.great{background:var(--success);}.score-circle.good{background:var(--primary);}.score-circle.ok{background:var(--accent);}.score-circle.poor{background:var(--danger);}
.score-label{font-size:11px;font-weight:400;opacity:.9;margin-top:2px;}
.results-stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.stat-pill{padding:8px 16px;border-radius:20px;font-size:.88rem;font-weight:600;}
.stat-pill.c{background:#d5f5e3;color:#1e8449;}.stat-pill.p{background:#fef9e7;color:#d4a017;}.stat-pill.w{background:#fde8e8;color:#c0392b;}
.results-card{background:var(--card);border-radius:var(--radius);padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center;margin-bottom:24px;}
.section-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:16px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.send-status{margin-top:12px;font-size:.88rem;min-height:22px;}.btn-row{text-align:center;margin-top:24px;}
</style>
</head>
<body>
<script>
const GAS_ENDPOINT='https://script.google.com/macros/s/AKfycbxUNNmmBxwBNHr-hweNoGR8bGDW0CqHNvdSbdG20Sms3UVOiV_8yICDqysOZms-aMH1/exec';
const TEST_ID=83;
const TEST_TITLE='Право Блок 3';
const BLOCK_NAME='Право';

const QUESTIONS=[
  {num:1,text:'Выберите верные суждения о трудовом праве и запишите цифры, под которыми они указаны.',options:['Трудовое право регулирует отношения между работниками и работодателями.','Трудовой договор — соглашение между работником и работодателем.','Трудовой кодекс РФ является основным источником трудового права.','Работодатель вправе требовать от работника труда, не обусловленного договором.','Работник обязан соблюдать правила внутреннего трудового распорядка.'],correct:[1,2,3,5],comment:'ТК РФ запрещает требовать труд за рамками договора. Работник обязан соблюдать ПВТР, дисциплину труда и охрану труда.'},
  {num:2,text:'Выберите верные суждения о трудовом договоре и запишите цифры, под которыми они указаны.',options:['Трудовой договор заключается в письменной форме.','Испытательный срок при приёме на работу не может превышать 3 месяцев для рядовых сотрудников.','Работодатель вправе расторгнуть трудовой договор с беременной женщиной по своей инициативе в любое время.','Работник обязан предупредить работодателя об увольнении за 2 недели.','Трудовой договор может быть срочным или бессрочным.'],correct:[1,2,4,5],comment:'ТК РФ запрещает увольнять беременных по инициативе работодателя (кроме ликвидации организации). Предупреждение об увольнении — 2 недели (ст. 80 ТК).'},
  {num:3,text:'Выберите верные суждения об административном праве и запишите цифры, под которыми они указаны.',options:['Административное право регулирует отношения в сфере государственного управления.','Источником административного права является КоАП РФ.','Административное правонарушение влечёт уголовную ответственность.','Административный штраф — вид административного наказания.','Субъектами административных правонарушений могут быть физические и юридические лица.'],correct:[1,2,4,5],comment:'Административное правонарушение (не уголовное!) влечёт административную ответственность. Виды наказаний: штраф, предупреждение, дисквалификация и др.'},
  {num:4,text:'Выберите верные суждения об уголовном праве и запишите цифры, под которыми они указаны.',options:['Уголовное право устанавливает, какие деяния являются преступлениями и какие наказания за них предусмотрены.','Единственным источником уголовного права в России является УК РФ.','Уголовной ответственности подлежат лица, достигшие 16 лет, а за тяжкие преступления — с 14 лет.','Незнание закона освобождает от уголовной ответственности.','Уголовное наказание назначается только судом.'],correct:[1,2,3,5],comment:'Незнание закона не освобождает от ответственности. Уголовная ответственность с 16 лет, с 14 — за убийство, грабёж, разбой и др. тяжкие (ст. 20 УК РФ).'},
  {num:5,text:'Выберите верные суждения о видах уголовного наказания и запишите цифры, под которыми они указаны.',options:['К видам уголовных наказаний относятся лишение свободы, штраф, исправительные работы.','Смертная казнь в РФ применяется за все умышленные преступления.','Пожизненное лишение свободы является высшей мерой наказания в РФ.','Лишение права занимать определённые должности — вид уголовного наказания.','Уголовное наказание преследует цели исправления осуждённого и предупреждения преступлений.'],correct:[1,3,4,5],comment:'В РФ смертная казнь не применяется с 1996 г. (мораторий). Высшая мера — пожизненное лишение свободы. Наказания перечислены в ст. 44 УК РФ.'},
  {num:6,text:'Выберите верные суждения о семейном праве в РФ и запишите цифры, под которыми они указаны.',options:['Семейное право регулирует брачно-семейные отношения.','Брак в РФ заключается только в органах ЗАГС.','Венчание в церкви имеет юридическую силу в РФ.','Брачный договор может регулировать имущественные права супругов.','Супруги обязаны строить отношения на основе взаимоуважения и взаимопомощи.'],correct:[1,2,4,5],comment:'Религиозные обряды не имеют юридической силы в РФ. Брачный договор (контракт) — ключевой инструмент семейного права для регулирования имущества.'},
  {num:7,text:'Выберите верные суждения о браке и разводе и запишите цифры, под которыми они указаны.',options:['Брачный возраст в РФ — 18 лет, в исключительных случаях может быть снижен.','Брак не может быть заключён между близкими родственниками.','Расторжение брака происходит только в суде.','Имущество, нажитое супругами в браке, является их совместной собственностью.','При разводе имущество делится поровну без учёта интересов детей.'],correct:[1,2,4],comment:'Развод возможен и в ЗАГСе (при отсутствии детей и взаимном согласии). При разделе имущества суд вправе отступить от равенства долей в интересах детей.'},
  {num:8,text:'Выберите верные суждения о правах ребёнка и запишите цифры, под которыми они указаны.',options:['Конвенция ООН о правах ребёнка закрепляет права детей на международном уровне.','Ребёнком признаётся лицо, не достигшее 18-летнего возраста.','Родители обязаны содержать своих несовершеннолетних детей.','Дети не имеют права на защиту от жестокого обращения.','Ребёнок вправе выражать своё мнение по вопросам, касающимся его интересов.'],correct:[1,2,3,5],comment:'Конвенция ООН о правах ребёнка 1989 г. — основа защиты прав детей. Дети защищены от жестокого обращения (ст. 19 Конвенции, ст. 56 СК РФ).'},
  {num:9,text:'Выберите верные суждения о гражданском процессе и запишите цифры, под которыми они указаны.',options:['Гражданский процесс — порядок рассмотрения гражданских дел судами.','Стороны в гражданском процессе: истец и ответчик.','В гражданском процессе бремя доказывания лежит на истце.','Гражданские дела рассматриваются только Верховным судом РФ.','Решение суда может быть обжаловано в вышестоящую инстанцию.'],correct:[1,2,3,5],comment:'Гражданские дела рассматривают районные суды, мировые судьи и другие суды первой инстанции — в зависимости от цены иска и категории дела.'},
  {num:10,text:'Выберите верные суждения об уголовном процессе и запишите цифры, под которыми они указаны.',options:['Уголовный процесс — порядок производства по уголовным делам.','Подозреваемый вправе пользоваться услугами адвоката с момента задержания.','Суд в уголовном процессе является стороной обвинения.','Приговор суда может быть обвинительным или оправдательным.','Уголовное дело может быть прекращено при примирении сторон по делам небольшой тяжести.'],correct:[1,2,4,5],comment:'Суд в уголовном процессе — независимый арбитр, а не сторона обвинения. Обвинение поддерживает прокурор. Примирение допустимо при условиях ст. 76 УК РФ.'}
];
</script>
<header><div class="header-icon">П</div><div><h1>Право Блок 3</h1><p>ЕГЭ Обществознание · verny-kurs.ru</p></div></header>
<div id="progress-wrap"><div id="progress-bar"></div></div>
<div class="screen active" id="screen-welcome"><div class="container"><div class="welcome-card"><h2>Право — Блок 3</h2><p class="subtitle">Трудовое право · Административное право<br>Уголовное право · Семейное право · Процесс</p><div class="info-grid"><div class="info-box"><strong id="q-count">10</strong>вопросов</div><div class="info-box"><strong>ЕГЭ</strong>Задание 20</div><div class="info-box"><strong>~15</strong>минут</div></div><div class="name-group"><label for="student-name">Ваше имя:</label><input type="text" id="student-name" placeholder="Введите имя и фамилию" autocomplete="name"></div><button class="btn" onclick="startTest()">Начать тест</button></div></div></div>
<div class="screen" id="screen-test"><div class="container"><div class="progress-label">Отвечено: <span id="answered-num">0</span> / <span id="total-num">0</span></div><div id="questions-container"></div><div class="btn-row"><button class="btn btn-accent" onclick="confirmSubmit()">Завершить тест</button></div></div></div>
<div class="screen" id="screen-results"><div class="container"><div class="results-card"><div id="score-circle" class="score-circle good"></div><div style="color:var(--muted);font-size:.88rem;">Ученик: <strong id="result-name"></strong></div><div class="results-stats"><div class="stat-pill c" id="stat-correct"></div><div class="stat-pill p" id="stat-partial"></div><div class="stat-pill w" id="stat-wrong"></div></div><div class="send-status" id="send-status">⏳ Отправка результатов...</div></div><div class="section-title">Разбор ответов</div><div id="results-container"></div><div class="btn-row"><button class="btn btn-accent" onclick="retryTest()">Пройти ещё раз</button></div></div></div>
<script>
let userAnswers={},studentName='';
function initAnswers(){userAnswers={};QUESTIONS.forEach(q=>{userAnswers[q.num]=[];});document.getElementById('q-count').textContent=QUESTIONS.length;}
function startTest(){studentName=document.getElementById('student-name').value.trim();if(!studentName){alert('Пожалуйста, введите ваше имя');return;}initAnswers();buildQuestions();showScreen('screen-test');document.getElementById('total-num').textContent=QUESTIONS.length;}
function buildQuestions(){const c=document.getElementById('questions-container');c.innerHTML='';QUESTIONS.forEach(q=>{const card=document.createElement('div');card.className='q-card';card.id='q-'+q.num;const opts=q.options.map((opt,i)=>{const n=i+1,l=String.fromCharCode(64+n);return`<li><label class="option-label" id="lbl-${q.num}-${n}"><input type="checkbox" style="flex-shrink:0;margin-top:2px;" onchange="toggleAnswer(${q.num},${n},this)"> <span>${l}) ${opt}</span></label></li>`;}).join('');card.innerHTML=`<div class="q-header"><div class="q-num">${q.num}</div><div class="q-text">${q.text}</div></div><ul class="options">${opts}</ul>`;c.appendChild(card);});}
function toggleAnswer(qId,optNum,cb){const idx=userAnswers[qId].indexOf(optNum);if(idx>-1)userAnswers[qId].splice(idx,1);else userAnswers[qId].push(optNum);const lbl=document.getElementById('lbl-'+qId+'-'+optNum);if(lbl)lbl.classList.toggle('selected',cb.checked);document.getElementById('q-'+qId).classList.toggle('answered',userAnswers[qId].length>0);updateProgress();}
function updateProgress(){const a=QUESTIONS.filter(q=>userAnswers[q.num].length>0).length;document.getElementById('answered-num').textContent=a;document.getElementById('progress-bar').style.width=(a/QUESTIONS.length*100)+'%';}
function confirmSubmit(){const a=QUESTIONS.filter(q=>userAnswers[q.num].length>0).length;if(a<QUESTIONS.length){if(!confirm(`Вы ответили на ${a} из ${QUESTIONS.length} вопросов. Завершить тест?`))return;}submitTest();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function retryTest(){showScreen('screen-welcome');document.getElementById('student-name').value='';}
function submitTest(){let correct=0,partial=0,wrong=0;QUESTIONS.forEach(q=>{const s=[...userAnswers[q.num]].sort((a,b)=>a-b),c=[...q.correct].sort((a,b)=>a-b);if(JSON.stringify(s)===JSON.stringify(c))correct++;else if(s.some(a=>c.includes(a)))partial++;else wrong++;});const score=Math.round(correct/QUESTIONS.length*100);showResults(score,correct,partial,wrong);if(GAS_ENDPOINT&&!GAS_ENDPOINT.includes('YOUR_GAS')){fetch(GAS_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({externalTest:true,testId:TEST_ID,studentName,score,correctCount:correct,wrongCount:wrong,totalCount:QUESTIONS.length,testTitle:TEST_TITLE,blockName:BLOCK_NAME})}).then(()=>{document.getElementById('send-status').innerHTML='✅ Результаты сохранены и отправлены преподавателю';}).catch(()=>{document.getElementById('send-status').innerHTML='⚠️ Не удалось отправить';});}else{document.getElementById('send-status').innerHTML='⚠️ GAS_ENDPOINT не настроен';}}
function showResults(score,correct,partial,wrong){document.getElementById('result-name').textContent=studentName;document.getElementById('stat-correct').textContent='✓ Верно: '+correct;document.getElementById('stat-partial').textContent='~ Частично: '+partial;document.getElementById('stat-wrong').textContent='✗ Неверно: '+wrong;const circle=document.getElementById('score-circle');circle.innerHTML=`<span>${score}%</span><span class="score-label">результат</span>`;circle.className='score-circle '+(score>=80?'great':score>=60?'good':score>=40?'ok':'poor');const container=document.getElementById('results-container');container.innerHTML='';QUESTIONS.forEach(q=>{const s=userAnswers[q.num],c=q.correct,ss=[...s].sort((a,b)=>a-b),cs=[...c].sort((a,b)=>a-b);let sc='q-wrong';if(JSON.stringify(ss)===JSON.stringify(cs))sc='q-correct';else if(s.some(a=>c.includes(a)))sc='q-partial';const opts=q.options.map((opt,i)=>{const n=i+1,isS=s.includes(n),isC=c.includes(n);let cls='';if(isS&&isC)cls='res-correct-chosen';else if(isS&&!isC)cls='res-wrong-chosen';else if(!isS&&isC)cls='res-correct-missed';const l=String.fromCharCode(64+n);return`<li><label class="option-label ${cls}"><input type="checkbox" disabled ${isS?'checked':''}> <span>${l}) ${opt}</span></label></li>`;}).join('');const card=document.createElement('div');card.className='q-card '+sc;card.innerHTML=`<div class="q-header"><div class="q-num">${q.num}</div><div class="q-text">${q.text}</div></div><ul class="options">${opts}</ul>${q.comment?`<div class="q-comment">${q.comment}</div>`:''}`;container.appendChild(card);});showScreen('screen-results');}
document.addEventListener('DOMContentLoaded',initAnswers);
</script>
</body></html>
