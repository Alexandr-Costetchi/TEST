<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#667eea">
<title>Правовое регулирование. Тест 2</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 10px; }
.container { width: 100%; max-width: 700px; background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 20px; }
.header { text-align: center; margin-bottom: 20px; }
.header h1 { color: #333; font-size: 22px; margin-bottom: 6px; }
.header p { color: #666; font-size: 13px; }
.name-input { width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; margin: 10px 0 16px; transition: border-color 0.2s; font-family: inherit; }
.name-input:focus { border-color: #667eea; }
.test-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
.question-screen { display: none; }
.question-screen.active { display: block; }
.progress-bar { width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.3s; }
.progress-text { font-size: 12px; color: #888; text-align: center; margin-bottom: 14px; }
.question-text { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 8px; line-height: 1.5; }
.question-subtitle { font-size: 12px; color: #888; margin-bottom: 14px; font-style: italic; }
.options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 18px; }
.option-label { display: flex; align-items: flex-start; padding: 11px 12px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.option-label.checked { border-color: #667eea; background: #f0ebff; }
.option-checkbox { width: 18px; height: 18px; min-width: 18px; margin-right: 10px; margin-top: 2px; cursor: pointer; accent-color: #667eea; }
.option-text { font-size: 13px; color: #333; line-height: 1.4; }
.nav-buttons { display: flex; gap: 10px; }
.nav-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px; }
.prev-btn { background: #f0f0f0; color: #333; }
.prev-btn:disabled { opacity: 0.5; }
.next-btn, .finish-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
.results-screen { display: none; text-align: center; }
.results-screen.active { display: block; }
.score-circle { width: 100px; height: 100px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 16px auto; font-size: 32px; font-weight: bold; color: white; }
.result-title { font-size: 20px; font-weight: 600; color: #333; margin: 16px 0 8px; }
.result-text { font-size: 14px; color: #666; margin: 8px 0; }
.correct-count { font-size: 14px; color: #888; margin: 8px 0; }
.review-section { margin-top: 20px; text-align: left; }
.review-title { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 12px; text-align: center; padding-bottom: 8px; border-bottom: 2px solid #e0e0e0; }
.review-question { margin-bottom: 14px; border: 1px solid #e0e0e0; border-radius: 10px; overflow: hidden; }
.review-qheader { padding: 9px 13px; font-size: 12px; font-weight: 600; color: #fff; line-height: 1.4; }
.review-qheader.correct { background: linear-gradient(135deg, #43a047, #2e7d32); }
.review-qheader.incorrect { background: linear-gradient(135deg, #e53935, #b71c1c); }
.review-qbody { padding: 10px 13px; background: #fafafa; }
.correct-answer-box { background: #e8f5e9; border: 1.5px solid #43a047; border-radius: 7px; padding: 7px 11px; margin-bottom: 8px; font-size: 12px; color: #1b5e20; }
.correct-answer-box strong { display: block; margin-bottom: 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
.rev-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; margin-bottom: 8px; color: #666; }
.rev-opt { display: flex; gap: 7px; padding: 4px 7px; border-radius: 5px; margin-bottom: 3px; font-size: 12px; line-height: 1.4; }
.rev-opt.uc { background: #e8f5e9; color: #2e7d32; font-weight: 600; }
.rev-opt.uw { background: #ffebee; color: #c62828; font-weight: 600; }
.rev-opt.ms { background: #fff3e0; color: #e65100; font-weight: 600; border-left: 3px solid #ff9800; }
.rev-opt.nn { color: #888; }
.back-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px; }
</style>
</head>
<body>
<div class="container">
  <div id="name-screen">
    <div class="header">
      <h1>⚖️ Правовое регулирование. Тест 2</h1>
      <p>Конституционные права. Гражданское право. Семейное право</p>
    </div>
    <input type="text" id="student-name" class="name-input" placeholder="Имя и фамилия" autocomplete="name" onkeyup="if(event.key==='Enter')startTest()">
    <button class="test-btn" onclick="startTest()">▶ Начать тест (20 вопросов)</button>
  </div>
  <div class="question-screen" id="question-screen">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-text" id="progress-text"></div>
    <div class="question-text" id="question-text"></div>
    <div class="question-subtitle" id="question-subtitle"></div>
    <div class="options" id="options-container"></div>
    <div class="nav-buttons">
      <button class="nav-btn prev-btn" id="prev-btn" onclick="prevQ()">← Назад</button>
      <button class="nav-btn next-btn" id="next-btn" onclick="nextQ()">Дальше →</button>
      <button class="nav-btn finish-btn" id="finish-btn" onclick="showResults()">Завершить</button>
    </div>
  </div>
  <div class="results-screen" id="results-screen">
    <div class="result-title">Результаты теста</div>
    <div class="score-circle" id="score-circle">0%</div>
    <p class="result-text" id="result-text"></p>
    <div class="correct-count">Правильно: <strong id="correct-count">0/20</strong></div>
    <div id="review-container" class="review-section"></div>
    <button class="back-btn" onclick="location.reload()">↩ Пройти заново</button>
  </div>
</div>
<script>
const questions = [
  {num:21, text:"Что из перечисленного относится к конституционным обязанностям граждан РФ? Запишите цифры, под которыми указаны конституционные обязанности.", subtitle:"Выберите все верные варианты", options:["Указание своей национальности.","Сохранение исторического и культурного наследия.","Участие в выборах органов власти.","Уплата налогов.","Свободное распоряжение своими способностями к труду.","Пользование родным языком."], correct:[1,3]},
  {num:22, text:"Что из перечисленного относится к социально-экономическим правам граждан, гарантированным Конституцией РФ? Запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Право на защиту чести и достоинства.","Право на отдых.","Право на выбор любой религии или атеизма.","Право на свободу экономической деятельности.","Право частной собственности.","Право избирать и быть избранным в органы государственной власти."], correct:[1,3,4]},
  {num:23, text:"Что из перечисленного относится к политическим правам (свободам) гражданина РФ? Запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Защищать Отечество.","Избирать и быть избранным.","Исповедовать индивидуально или совместно с другими любую религию или не исповедовать никакой.","Проводить шествия и пикетирования.","Свободно использовать свои способности и имущество для предпринимательской деятельности.","Направлять индивидуальные и коллективные обращения в государственные органы."], correct:[1,3,5]},
  {num:24, text:"Что из перечисленного относится к личным (гражданским) правам гражданина РФ? Запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Право на социальное обеспечение.","Право на жизнь.","Право на жилище.","Право на защиту чести и доброго имени.","Право на свободу и личную неприкосновенность."], correct:[1,3,4]},
  {num:25, text:"Что из перечисленного относится к группе культурных свобод и прав гражданина РФ? Запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Свобода творчества.","Участие в культурной жизни.","Сохранение исторического и культурного наследия.","Сохранение природы и окружающей среды.","Доступ к культурным ценностям."], correct:[0,1,4]},
  {num:26, text:"Найдите в приведённом ниже списке элементы правового статуса несовершеннолетних в возрасте от 14 до 18 лет. Запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["право самостоятельно распоряжаться своей стипендией, заработком и иными доходами","право самостоятельно продать доставшуюся по наследству квартиру","право вносить вклады в банк от своего имени","право осуществлять права авторства литературного произведения","право самостоятельно заключать любые сделки","право с 15-летнего возраста быть членом кооператива"], correct:[0,2,3]},
  {num:27, text:"Найдите в приведённом ниже списке особенности гражданских правоотношений. Запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Гражданские правоотношения основываются на принципе свободы договора.","Гражданские правоотношения основываются на принципе равенства сторон.","Гражданские правоотношения регулируют отношения в сфере государственного управления.","Гражданские правоотношения регулируют отношения между работодателем и наёмным работником, основанные на трудовом договоре.","Гражданские правоотношения возникают исключительно в результате совершения преступления.","Участниками гражданских правоотношений являются: публично-правовые образования, юридические лица, физические лица."], correct:[0,1,5]},
  {num:28, text:"Выберите верные суждения о субъектах гражданского права и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Юридические лица – это организации, имеющие право участвовать в гражданско-правовом обороте.","Лица без гражданства не могут являться субъектами гражданского права.","Несовершеннолетние в возрасте от 14 до 18 лет вправе самостоятельно распоряжаться своими заработками, стипендией и иными доходами.","Гражданская дееспособность физического лица возникает с момента рождения человека.","Гражданская правоспособность юридического лица возникает с момента его регистрации в установленном законом порядке."], correct:[0,2,4]},
  {num:29, text:"Выберите верные суждения о гражданско-правовой ответственности и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Гражданско-правовую ответственность в полном объёме несут лица, достигшие 18 лет.","Гражданско-правовая ответственность носит имущественный характер.","Гражданско-правовая ответственность может предполагать лишение свободы.","Гражданско-правовая ответственность может быть предусмотрена законом или договором.","Гражданско-правовую ответственность несут только физические лица."], correct:[0,1,3]},
  {num:30, text:"Выберите верные суждения о субъектах гражданского права. Запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Гражданская дееспособность физического лица в полном объеме возникает с момента рождения человека.","Субъектами гражданского права могут выступать физические и юридические лица, а также государство и муниципальные образования.","Объём правоспособности у всех дееспособных граждан одинаков.","Недееспособными по решению суда признаются граждане, которые вследствие психического расстройства не могут понимать значения своих действий или руководить ими.","Частично дееспособными принято называть граждан по достижении 16 лет."], correct:[1,2,3]},
  {num:31, text:"Выберите верные суждения о способах защиты имущественных и личных неимущественных прав и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Защиту имущественных и неимущественных прав может осуществлять любой правоспособный гражданин.","В случае неисполнения или ненадлежащего исполнения обязательства в соответствии с законом должник обязан уплатить кредитору неустойку.","Любой человек, чьи имущественные или личные неимущественные права были нарушены, получает компенсацию морального вреда.","Если сведения, порочащие честь, достоинство или деловую репутацию гражданина, оказались доступными в интернете, гражданин вправе требовать удаления соответствующей информации, а также её опровержения.","К способам защиты имущественных и личных неимущественных прав относится восстановление положения, которое существовало до нарушения права."], correct:[1,3,4]},
  {num:32, text:"Выберите верные суждения о гражданско-правовой ответственности и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Гражданско-правовая ответственность для граждан наступает в полном объёме с 16 лет.","Субъектами гражданско-правовой ответственности могут быть публично-правовые образования.","Гражданско-правовая ответственность носит исключительно имущественный характер.","Гражданско-правовая ответственность может наступать как в силу закона, так и на основании договора.","Одной из мер гражданско-правовой ответственности являются обязательные работы."], correct:[1,2,3]},
  {num:33, text:"Гражданин Николай Иванов закончил курс основ предпринимательства и решил основать собственное индивидуальное предприятие, заняться разработкой сайтов. Выберите в приведённом ниже списке преимущества подобной формы бизнеса и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["лёгкость получения банковских кредитов","высокая степень сохранности коммерческой информации","простота организации и управления","не надо делиться прибылью с совладельцами","достаточно средств для рекламной кампании","возможность привлечь высококлассных специалистов"], correct:[1,2,3]},
  {num:34, text:"Найдите в приведённом ниже списке формы, в которых могут создаваться юридические лица, являющиеся коммерческими организациями. Запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["общественное объединение","хозяйственное общество","хозяйственное товарищество","производственный кооператив","потребительский кооператив","благотворительный фонд"], correct:[1,2,3]},
  {num:35, text:"Найдите в приведённом ниже списке обязательные условия заключения брака, определённые законодательством РФ, и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Наличие работы хотя бы у одного из будущих супругов.","Добровольное согласие лиц, вступающих в брак.","Наличие жилья хотя бы у одного из будущих супругов.","Наличие собственности хотя бы у одного из будущих супругов.","Отсутствие судимости у лиц, вступающих в брак.","Достижение брачного возраста."], correct:[1,5]},
  {num:36, text:"Выберите верные суждения о семейном праве в РФ и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Семейное право регулирует имущественные и личные неимущественные отношения между членами семьи.","Брак приостанавливается вследствие объявления органом ЗАГС одного из супругов умершим.","Брак заключается в органах записи актов гражданского состояния (ЗАГС).","Законный режим имущества супругов устанавливается только брачным договором.","Родители обязаны предоставлять содержание своим несовершеннолетним детям."], correct:[0,2,4]},
  {num:37, text:"Выберите верные суждения о брачном договоре и запишите цифры, под которыми они указаны.", subtitle:"Выберите все верные варианты", options:["Брачный договор может быть заключён только между лицами, состоящими в браке.","Брачный договор регулирует исключительно имущественные права и обязанности супругов.","Брачный договор подлежит обязательному нотариальному удостоверению.","Брачный договор может быть изменён или расторгнут только по взаимному соглашению супругов.","Брачный договор может устанавливать алиментные обязательства супругов в отношении детей.","Брачный договор может быть заключён как в отношении имеющегося, так и в отношении будущего имущества супругов."], correct:[1,2,3,5]},

let currentIdx = 0;
let userAnswers = {};

function startTest() {
  const inp = document.getElementById('student-name');
  const name = inp.value.trim();
  if (!name) { inp.style.borderColor='#e53935'; inp.placeholder='Введите имя'; return; }
  window._studentName = name;
  document.getElementById('name-screen').style.display = 'none';
  document.getElementById('question-screen').classList.add('active');
  showQ();
}

function showQ() {
  const q = questions[currentIdx];
  const pct = Math.round((currentIdx+1)/questions.length*100);
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-text').textContent = 'Вопрос '+(currentIdx+1)+' из '+questions.length;
  document.getElementById('question-text').textContent = '№'+q.num+'. '+q.text;
  document.getElementById('question-subtitle').textContent = q.subtitle;
  const c = document.getElementById('options-container');
  c.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const checked = (userAnswers[currentIdx]||[]).includes(idx);
    const label = document.createElement('label');
    label.className = 'option-label'+(checked?' checked':'');
    label.innerHTML = '<input type="checkbox" class="option-checkbox"'+(checked?' checked':'')+'><span class="option-text">'+(idx+1)+') '+opt+'</span>';
    label.querySelector('input').onchange = () => {
      if (!userAnswers[currentIdx]) userAnswers[currentIdx]=[];
      if (label.querySelector('input').checked) { if(!userAnswers[currentIdx].includes(idx)) userAnswers[currentIdx].push(idx); label.classList.add('checked'); }
      else { userAnswers[currentIdx]=userAnswers[currentIdx].filter(x=>x!==idx); label.classList.remove('checked'); }
    };
    c.appendChild(label);
  });
  document.getElementById('prev-btn').disabled = currentIdx===0;
  document.getElementById('next-btn').style.display = currentIdx<questions.length-1?'block':'none';
  document.getElementById('finish-btn').style.display = currentIdx===questions.length-1?'block':'none';
}

function nextQ() { if(currentIdx<questions.length-1){currentIdx++;showQ();} }
function prevQ() { if(currentIdx>0){currentIdx--;showQ();} }

function showResults() {
  let correct=0;
  const detailsArr=[];
  const rc=document.getElementById('review-container');
  rc.innerHTML='<div class="review-title">📝 Разбор ответов</div>';
  questions.forEach((q,idx) => {
    const userAns=(userAnswers[idx]||[]).slice().sort((a,b)=>a-b);
    const corrAns=q.correct.slice().sort((a,b)=>a-b);
    const isCorrect=JSON.stringify(userAns)===JSON.stringify(corrAns);
    if(isCorrect) correct++;
    detailsArr.push({q:q.num, chosen:userAns.map(i=>i+1).join(', ')||'—', correct:corrAns.map(i=>i+1).join(', '), status:isCorrect?'correct':'wrong'});
    const div=document.createElement('div');
    div.className='review-question';
    const corrNums=corrAns.map(i=>i+1).join(', ');
    div.innerHTML='<div class="review-qheader '+(isCorrect?'correct':'incorrect')+'">'+(isCorrect?'✅':'❌')+' №'+q.num+'. '+q.text+'</div>'+
      '<div class="review-qbody"><div class="correct-answer-box"><strong>Правильный ответ:</strong>'+corrNums+'</div>';
    const legend=document.createElement('div');
    legend.className='rev-legend';
    legend.innerHTML='<span>🟢 верно выбран</span><span>🔴 лишний</span><span>🟡 пропущен</span>';
    div.querySelector('.review-qbody').appendChild(legend);
    q.options.forEach((opt,oi)=>{
      const inUser=userAns.includes(oi), inCorr=corrAns.includes(oi);
      let cls='nn', icon='';
      if(inUser&&inCorr){cls='uc';icon='🟢';}
      else if(inUser&&!inCorr){cls='uw';icon='🔴';}
      else if(!inUser&&inCorr){cls='ms';icon='🟡';}
      if(cls!=='nn'||true){
        const od=document.createElement('div');
        od.className='rev-opt '+cls;
        od.textContent=icon+' '+(oi+1)+') '+opt;
        div.querySelector('.review-qbody').appendChild(od);
      }
    });
    div.querySelector('.review-qbody').innerHTML+='</div>';
    rc.appendChild(div);
  });
  const pct=Math.round(correct/questions.length*100);
  document.getElementById('score-circle').textContent=pct+'%';
  document.getElementById('correct-count').textContent=correct+'/'+questions.length;
  let msg='';
  if(pct>=90)msg='Отлично! Превосходный результат!';
  else if(pct>=70)msg='Хорошо! Продолжайте в том же духе!';
  else if(pct>=50)msg='Удовлетворительно. Стоит повторить материал.';
  else msg='Нужно повторить тему.';
  document.getElementById('result-text').textContent=window._studentName+', '+msg;
  (function(){
    var name=window._studentName||'Аноним';
    var ts=new Date().toLocaleString('ru-RU');
    fetch('https://script.google.com/macros/s/AKfycbxUNNmmBxwBNHr-hweNoGR8bGDW0CqHNvdSbdG20Sms3UVOiV_8yICDqysOZms-aMH1/exec',{
      method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({name:name,testName:'Правовое регулирование. Тест 2',date:ts,score_pct:pct,correct:correct,partial:0,wrong:questions.length-correct,total:questions.length,details:JSON.stringify(detailsArr)})
    }).catch(function(){});
  })();
  document.getElementById('question-screen').classList.remove('active');
  document.getElementById('results-screen').classList.add('active');
}
</script>
