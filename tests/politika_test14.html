<style>

<script>
const LETTERS = ['А','Б','В','Г','Д'];
let userAnswers = {}, studentName = '';

function initAnswers() {
  userAnswers = {};
  QUESTIONS.forEach(q => { userAnswers[q.num] = [null,null,null,null,null]; });
  document.getElementById('q-count').textContent = QUESTIONS.length;
}

function startTest() {
  studentName = document.getElementById('student-name').value.trim();
  if (!studentName) { alert('Пожалуйста, введите ваше имя'); return; }
  initAnswers();
  buildQuestions();
  showScreen('screen-test');
  document.getElementById('total-num').textContent = QUESTIONS.length;
}

function buildQuestions() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  QUESTIONS.forEach(q => {
    const card = document.createElement('div');
    card.className = 'q-card'; card.id = 'q-' + q.num;

    const colAItems = q.colA.map(item => `<div class="col-item">${item}</div>`).join('');
    const colBItems = q.colB.map(item => `<div class="col-item">${item}</div>`).join('');

    const answerCells = q.colA.map((_, i) => {
      const opts = q.colB.map((_, j) => `<option value="${j+1}">${j+1}</option>`).join('');
      return `<div class="ans-cell">
        <div class="ans-letter">${LETTERS[i]}</div>
        <select class="ans-sel" id="sel-${q.num}-${i}" onchange="setAnswer(${q.num},${i},this)">
          <option value="">—</option>${opts}
        </select>
      </div>`;
    }).join('');

    card.innerHTML = `
      <div class="q-header"><div class="q-num">${q.num}</div><div class="q-text">${q.text}</div></div>
      <div class="match-cols">
        <div class="match-col"><div class="col-header">${q.colAHeader}</div>${colAItems}</div>
        <div class="match-col"><div class="col-header">${q.colBHeader}</div>${colBItems}</div>
      </div>
      <div class="answer-grid">${answerCells}</div>`;
    container.appendChild(card);
  });
}

function setAnswer(qNum, idx, selectEl) {
  const val = selectEl.value ? parseInt(selectEl.value) : null;
  userAnswers[qNum][idx] = val;
  selectEl.classList.toggle('filled', val !== null);
  const allFilled = userAnswers[qNum].every(v => v !== null);
  document.getElementById('q-' + qNum).classList.toggle('answered', allFilled);
  updateProgress();
}

function updateProgress() {
  const done = QUESTIONS.filter(q => userAnswers[q.num].every(v => v !== null)).length;
  document.getElementById('answered-num').textContent = done;
  document.getElementById('progress-bar').style.width = (done / QUESTIONS.length * 100) + '%';
}

function confirmSubmit() {
  const done = QUESTIONS.filter(q => userAnswers[q.num].every(v => v !== null)).length;
  if (done < QUESTIONS.length) {
    if (!confirm(`Выполнено ${done} из ${QUESTIONS.length} заданий. Завершить?`)) return;
  }
  submitTest();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

function retryTest() {
  showScreen('screen-welcome');
  document.getElementById('student-name').value = '';
}

function submitTest() {
  let totalPairs=0, correctPairs=0, verny=0, chastichno=0, neverno=0;
  const detailsArr = [];
  QUESTIONS.forEach(q => {
    let qOk = 0;
    q.correct.forEach((c, i) => {
      totalPairs++;
      if (userAnswers[q.num][i] === c) { correctPairs++; qOk++; }
    });
    detailsArr.push({q:q.num, chosen:(userAnswers[q.num]||[]).join(","), correct:q.correct.join(","), pairs_ok:qOk, pairs_total:q.correct.length});
    if (qOk === q.correct.length) verny++;
    else if (qOk > 0) chastichno++;
    else neverno++;
  });
  const score = Math.round(correctPairs / totalPairs * 100);
  showResults(score, correctPairs, totalPairs, verny, chastichno, neverno);
  fetch(GAS_ENDPOINT, {
    method: "POST", mode: "no-cors",
    headers: {"Content-Type": "text/plain"},
    body: JSON.stringify({
      testId: TEST_ID,
      name: studentName, testName: TEST_TITLE, blockName: BLOCK_NAME,
      date: new Date().toLocaleString("ru-RU"),
      score_pct: score, correct: verny, partial: chastichno,
      wrong: neverno, total: QUESTIONS.length,
      details: JSON.stringify(detailsArr)
    })
  }).then(() => {
    document.getElementById("send-status").innerHTML = "✅ Результаты сохранены и отправлены преподавателю";
  }).catch(() => {
    document.getElementById("send-status").innerHTML = "⚠️ Не удалось отправить";
  });
}

function showResults(score, correctPairs, totalPairs, verny, chastichno, neverno) {
  document.getElementById('result-name').textContent = studentName;
  document.getElementById('stat-correct').textContent = '✓ Полностью верно: ' + verny;
  document.getElementById('stat-partial').textContent = '~ Частично: ' + chastichno;
  document.getElementById('stat-wrong').textContent = '✗ Неверно: ' + neverno;

  const circle = document.getElementById('score-circle');
  circle.innerHTML = `<span>${score}%</span><span class="score-label">пар верно</span>`;
  circle.className = 'score-circle ' + (score>=80?'great':score>=60?'good':score>=40?'ok':'poor');

  const container = document.getElementById('results-container');
  container.innerHTML = '';

  QUESTIONS.forEach(q => {
    const ans = userAnswers[q.num];
    let qOk = 0;
    ans.forEach((v, i) => { if (v === q.correct[i]) qOk++; });

    let sc = qOk === q.correct.length ? 'q-correct' : qOk > 0 ? 'q-partial' : 'q-wrong';

    const colBRef = q.colB.map(b => `<div>${b}</div>`).join('');
    const rows = LETTERS.slice(0, q.colA.length).map((letter, i) => {
      const isOk = ans[i] === q.correct[i];
      const sVal = ans[i] || '—';
      return `<tr class="${isOk?'pair-correct':'pair-wrong'}">
        <td><b>${letter}</b></td>
        <td>${q.colA[i].replace(/^[А-ДA-D]\)\s?/,'')}</td>
        <td>${sVal}</td>
        <td>${q.correct[i]} ${isOk?'✓':'✗'}</td>
      </tr>`;
    }).join('');

    const card = document.createElement('div');
    card.className = 'q-card ' + sc;
    card.innerHTML = `
      <div class="q-header"><div class="q-num">${q.num}</div><div class="q-text">${q.text}</div></div>
      <div class="col-b-ref"><strong>${q.colBHeader}:</strong>${colBRef}</div>
      <table class="result-table">
        <thead><tr><th>Буква</th><th>${q.colAHeader}</th><th>Ваш ответ</th><th>Верный</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="q-score">${qOk} / ${q.correct.length} пар верно</div>`;
    container.appendChild(card);
  });

  showScreen('screen-results');
}

document.addEventListener('DOMContentLoaded', initAnswers);
</script>
</body>
</html>
