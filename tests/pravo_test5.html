:root{--primary:#1b4f72;--primary-light:#2874a6;--accent:#d4a017;--success:#1e8449;--danger:#c0392b;--bg:#f4f6f9;--card:#fff;--border:#d5d8dc;--muted:#717d7e;--radius:10px;}

.container{max-width:760px;margin:0 auto;padding:24px 16px 64px;}
.welcome-card{background:var(--card);border-radius:var(--radius);padding:32px 28px;box-shadow:0 2px 12px rgba(0,0,0,.07);text-align:center;}

.info-box{background:var(--bg);border-radius:8px;padding:12px 8px;font-size:.82rem;color:var(--muted);}

.name-group{text-align:left;margin-bottom:22px;}.name-group label{display:block;font-weight:600;margin-bottom:7px;font-size:.92rem;}
.name-group input{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:8px;font-size:1rem;outline:none;transition:border-color .2s;}
.name-group input:focus{border-color:var(--primary-light);}
.btn{display:inline-block;padding:13px 32px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s,transform .1s;}
.btn:hover{background:var(--primary-light);}.btn:active{transform:scale(.98);}

.progress-label{font-size:.82rem;color:var(--muted);margin-bottom:14px;}

.q-card.answered{border-left-color:var(--primary-light);}

.q-card.q-partial{border-left-color:var(--accent);}

.q-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}

.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px;background:var(--bg);border-radius:8px;padding:12px;border:1px solid var(--border);}

.answer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-top:12px;border-top:1px dashed var(--border);}
.ans-cell{display:flex;flex-direction:column;align-items:center;gap:3px;}
.ans-letter{font-weight:700;color:var(--primary);font-size:.88rem;}

      <p class="subtitle">Налоговое право · Образование<br>Уголовный процесс · Юридическая ответственность</p>
      <div class="info-grid">
        <div class="info-box"><strong id="q-count">15</strong>заданий</div>
        <div class="info-box"><strong>ЕГЭ</strong>Задание 13</div>
        <div class="info-box"><strong>~20</strong>минут</div>
      </div>
      <div class="name-group"><label for="student-name">Ваше имя:</label><input type="text" id="student-name" placeholder="Введите имя и фамилию" autocomplete="name"></div>
      <button class="btn" onclick="startTest()">Начать тест</button>
    </div>
  </div>
</div>

<div class="screen" id="screen-test">
  <div class="container">
    <div class="progress-label">Выполнено: <span id="answered-num">0</span> / <span id="total-num">15</span></div>
    <div id="questions-container"></div>
    <div class="btn-row"><button class="btn btn-accent" onclick="confirmSubmit()">Завершить тест</button></div>
  </div>
</div>

<div class="screen" id="screen-results">
  <div class="container">
    <div class="results-card">
      <div id="score-circle" class="score-circle good"></div>
      <div style="color:var(--muted);font-size:.88rem;">Ученик: <strong id="result-name"></strong></div>
      <div class="results-stats">
        <div class="stat-pill c" id="stat-correct"></div>
        <div class="stat-pill p" id="stat-partial"></div>
        <div class="stat-pill w" id="stat-wrong"></div>
      </div>
      <div class="send-status" id="send-status">⏳ Отправка результатов...</div>
    </div>
    <div class="section-title">Разбор по заданиям</div>
    <div id="results-container"></div>
    <div class="btn-row"><button class="btn btn-accent" onclick="retryTest()">Пройти ещё раз</button></div>
  </div>
</div>

<script>
const LETTERS=['А','Б','В','Г','Д'];
let userAnswers={},studentName='';

function initAnswers(){userAnswers={};QUESTIONS.forEach(q=>{userAnswers[q.num]=[null,null,null,null,null];});document.getElementById('q-count').textContent=QUESTIONS.length;}
function startTest(){studentName=document.getElementById('student-name').value.trim();if(!studentName){alert('Пожалуйста, введите ваше имя');return;}initAnswers();buildQuestions();showScreen('screen-test');document.getElementById('total-num').textContent=QUESTIONS.length;}
function buildQuestions(){const container=document.getElementById('questions-container');container.innerHTML='';QUESTIONS.forEach(q=>{const card=document.createElement('div');card.className='q-card';card.id='q-'+q.num;const colAItems=q.colA.map(item=>`<div class="col-item">${item}</div>`).join('');const colBItems=q.colB.map(item=>`<div class="col-item">${item}</div>`).join('');const answerCells=q.colA.map((_,i)=>{const opts=q.colB.map((_,j)=>`<option value="${j+1}">${j+1}</option>`).join('');return`<div class="ans-cell"><div class="ans-letter">${LETTERS[i]}</div><select class="ans-sel" id="sel-${q.num}-${i}" onchange="setAnswer(${q.num},${i},this)"><option value="">—</option>${opts}</select></div>`;}).join('');card.innerHTML=`<div class="q-header"><div class="q-num">${q.num}</div><div class="q-text">${q.text}</div></div><div class="match-cols"><div class="match-col"><div class="col-header">${q.colAHeader}</div>${colAItems}</div><div class="match-col"><div class="col-header">${q.colBHeader}</div>${colBItems}</div></div><div class="answer-grid">${answerCells}</div>`;container.appendChild(card);});}
function setAnswer(qNum,idx,selectEl){const val=selectEl.value?parseInt(selectEl.value):null;userAnswers[qNum][idx]=val;selectEl.classList.toggle('filled',val!==null);const allFilled=userAnswers[qNum].every(v=>v!==null);document.getElementById('q-'+qNum).classList.toggle('answered',allFilled);updateProgress();}
function updateProgress(){const done=QUESTIONS.filter(q=>userAnswers[q.num].every(v=>v!==null)).length;document.getElementById('answered-num').textContent=done;document.getElementById('progress-bar').style.width=(done/QUESTIONS.length*100)+'%';}
function confirmSubmit(){const done=QUESTIONS.filter(q=>userAnswers[q.num].every(v=>v!==null)).length;if(done<QUESTIONS.length){if(!confirm(`Выполнено ${done} из ${QUESTIONS.length} заданий. Завершить?`))return;}submitTest();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function retryTest(){showScreen('screen-welcome');document.getElementById('student-name').value='';}
function submitTest(){let totalPairs=0,correctPairs=0,verny=0,chastichno=0,neverno=0;const detailsArr=[];QUESTIONS.forEach(q=>{let qOk=0;q.correct.forEach((c,i)=>{totalPairs++;if(userAnswers[q.num][i]===c){correctPairs++;qOk++;}});detailsArr.push({q:q.num,chosen:(userAnswers[q.num]||[]).join(","),correct:q.correct.join(","),pairs_ok:qOk,pairs_total:q.correct.length});if(qOk===q.correct.length)verny++;else if(qOk>0)chastichno++;else neverno++;});const score=Math.round(correctPairs/totalPairs*100);showResults(score,correctPairs,totalPairs,verny,chastichno,neverno);fetch(GAS_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({testId:TEST_ID,name:studentName,testName:TEST_TITLE,blockName:BLOCK_NAME,date:new Date().toLocaleString("ru-RU"),score_pct:score,correct:verny,partial:chastichno,wrong:neverno,total:QUESTIONS.length,details:JSON.stringify(detailsArr)})}).then(()=>{document.getElementById("send-status").innerHTML="✅ Результаты сохранены и отправлены преподавателю";}).catch(()=>{document.getElementById("send-status").innerHTML="⚠️ Не удалось отправить";});}
function showResults(score,correctPairs,totalPairs,verny,chastichno,neverno){document.getElementById('result-name').textContent=studentName;document.getElementById('stat-correct').textContent='✓ Полностью верно: '+verny;document.getElementById('stat-partial').textContent='~ Частично: '+chastichno;document.getElementById('stat-wrong').textContent='✗ Неверно: '+neverno;const circle=document.getElementById('score-circle');circle.innerHTML=`<span>${score}%</span><span class="score-label">пар верно</span>`;circle.className='score-circle '+(score>=80?'great':score>=60?'good':score>=40?'ok':'poor');const container=document.getElementById('results-container');container.innerHTML='';QUESTIONS.forEach(q=>{const ans=userAnswers[q.num];let qOk=0;ans.forEach((v,i)=>{if(v===q.correct[i])qOk++;});let sc=qOk===q.correct.length?'q-correct':qOk>0?'q-partial':'q-wrong';const colBRef=q.colB.map(b=>`<div>${b}</div>`).join('');const rows=LETTERS.slice(0,q.colA.length).map((letter,i)=>{const isOk=ans[i]===q.correct[i];const sVal=ans[i]||'—';return`<tr class="${isOk?'pair-correct':'pair-wrong'}"><td><b>${letter}</b></td><td>${q.colA[i].replace(/^[А-ДA-D]\)\s?/,'')}</td><td>${sVal}</td><td>${q.correct[i]} ${isOk?'✓':'✗'}</td></tr>`;}).join('');const card=document.createElement('div');card.className='q-card '+sc;card.innerHTML=`<div class="q-header"><div class="q-num">${q.num}</div><div class="q-text">${q.text}</div></div><div class="col-b-ref"><strong>${q.colBHeader}:</strong>${colBRef}</div><table class="result-table"><thead><tr><th>Буква</th><th>${q.colAHeader}</th><th>Ваш ответ</th><th>Верный</th></tr></thead><tbody>${rows}</tbody></table><div class="q-score">${qOk} / ${q.correct.length} пар верно</div>`;container.appendChild(card);});showScreen('screen-results');}
document.addEventListener('DOMContentLoaded',initAnswers);
</script>
</body>
</html>
