<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a237e">
<title>Политика. Задание 13 — Соответствие</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#1a237e 0%,#283593 50%,#3949ab 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.container{width:100%;max-width:740px;background:white;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,0.35);padding:22px}
.header{text-align:center;margin-bottom:20px}
.header h1{color:#1a237e;font-size:20px;margin-bottom:5px;line-height:1.3}
.header p{color:#666;font-size:13px}
.name-input{width:100%;padding:14px;border:2px solid #ddd;border-radius:10px;font-size:16px;outline:none;margin:10px 0 16px;transition:border-color 0.2s;font-family:inherit}
.name-input:focus{border-color:#3949ab}
.test-btn{width:100%;padding:16px;background:linear-gradient(135deg,#1a237e,#3949ab);color:white;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.question-screen{display:none}
.question-screen.active{display:block}
.progress-bar{width:100%;height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,#1a237e,#3949ab);transition:width 0.3s}
.progress-text{font-size:12px;color:#888;text-align:center;margin-bottom:14px}
.q-instruction{font-size:14px;font-weight:700;color:#1a237e;margin-bottom:12px;line-height:1.5;padding:10px 12px;background:#e8eaf6;border-radius:8px;border-left:4px solid #3949ab}
.columns-header{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.col-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#555;text-align:center;padding:5px;background:#f5f5f5;border-radius:6px}
.match-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;align-items:stretch}
.item-box{padding:10px 12px;background:#f9f9fb;border:2px solid #e0e0e0;border-radius:8px;font-size:13px;color:#333;line-height:1.4}
.item-letter{font-weight:700;color:#3949ab;margin-right:4px}
.cats-box{display:flex;flex-direction:column;gap:5px;justify-content:center}
.cat-label{display:flex;align-items:flex-start;gap:7px;padding:7px 10px;border:2px solid #e0e0e0;border-radius:7px;cursor:pointer;transition:all 0.15s;font-size:12px;line-height:1.3}
.cat-label:hover{border-color:#3949ab;background:#e8eaf6}
.cat-label.selected{border-color:#3949ab;background:#e8eaf6;font-weight:600}
.cat-radio{min-width:15px;height:15px;margin-top:1px;accent-color:#3949ab;cursor:pointer}
.cat-num{font-weight:700;color:#3949ab;min-width:14px}
.nav-buttons{display:flex;gap:10px;margin-top:16px}
.nav-btn{flex:1;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
.prev-btn{background:#f0f0f0;color:#333}
.prev-btn:disabled{opacity:0.5}
.next-btn,.finish-btn{background:linear-gradient(135deg,#1a237e,#3949ab);color:white}
.results-screen{display:none;text-align:center}
.results-screen.active{display:block}
.score-circle{width:100px;height:100px;background:linear-gradient(135deg,#1a237e,#3949ab);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:16px auto;font-size:30px;font-weight:bold;color:white}
.result-title{font-size:20px;font-weight:600;color:#333;margin:16px 0 8px}
.result-text{font-size:14px;color:#666;margin:8px 0}
.correct-count{font-size:14px;color:#888;margin:8px 0}
.review-section{margin-top:20px;text-align:left}
.review-title{font-size:15px;font-weight:700;color:#333;margin-bottom:12px;text-align:center;padding-bottom:8px;border-bottom:2px solid #e0e0e0}
.rev-q{margin-bottom:16px;border:1px solid #e0e0e0;border-radius:10px;overflow:hidden}
.rev-qhead{padding:9px 13px;font-size:12px;font-weight:600;color:#fff;line-height:1.4}
.rev-qhead.ok{background:linear-gradient(135deg,#388e3c,#2e7d32)}
.rev-qhead.fail{background:linear-gradient(135deg,#e53935,#b71c1c)}
.rev-body{padding:10px 13px;background:#fafafa}
.rev-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.rev-table th{background:#e8eaf6;color:#1a237e;padding:5px 8px;text-align:left;font-size:11px;text-transform:uppercase}
.rev-table td{padding:6px 8px;border-bottom:1px solid #eee;line-height:1.4}
.rev-table tr.wrong-row td{background:#ffebee;color:#c62828}
.rev-table tr.right-row td{background:#e8f5e9;color:#2e7d32}
.back-btn{width:100%;padding:12px;background:linear-gradient(135deg,#1a237e,#3949ab);color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:16px}
</style>

var currentIdx=0;
var userAnswers={};

function startTest(){
  var inp=document.getElementById('student-name');
  var name=inp.value.trim();
  if(!name){inp.style.borderColor='#e53935';inp.placeholder='Введите имя';return;}
  window._studentName=name;
  document.getElementById('name-screen').style.display='none';
  document.getElementById('question-screen').classList.add('active');
  showQ();
}

function showQ(){
  var q=questions[currentIdx];
  var pct=Math.round((currentIdx+1)/questions.length*100);
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-text').textContent='Вопрос '+(currentIdx+1)+' из '+questions.length;
  
  if(!userAnswers[currentIdx]) userAnswers[currentIdx]={};
  
  var catKeys=Object.keys(q.categories);
  
  var html='<div class="q-instruction">\u2116'+q.num+'. '+q.text+'</div>';
  html+='<div class="columns-header"><div class="col-head">'+q.leftHeader+'</div><div class="col-head">'+q.rightHeader+'</div></div>';
  
  q.items.forEach(function(item){
    html+='<div class="match-row">';
    html+='<div class="item-box"><span class="item-letter">'+item.letter+')</span>'+item.text+'</div>';
    html+='<div class="cats-box" id="cats-'+item.letter+'">';
    catKeys.forEach(function(k){
      var selected=userAnswers[currentIdx][item.letter]===k;
      html+='<label class="cat-label'+(selected?' selected':'')+'" onclick="selectCat(\u0027'+item.letter+'\u0027,\u0027'+k+'\u0027,this)">';
      html+='<input type="radio" class="cat-radio" name="q'+currentIdx+'_'+item.letter+'" value="'+k+'"'+(selected?' checked':'')+' onclick="event.stopPropagation()">';
      html+='<span class="cat-num">'+k+'</span><span>'+q.categories[k]+'</span></label>';
    });
    html+='</div></div>';
  });
  
  document.getElementById('q-body').innerHTML=html;
  document.getElementById('prev-btn').disabled=currentIdx===0;
  document.getElementById('next-btn').style.display=currentIdx<questions.length-1?'block':'none';
  document.getElementById('finish-btn').style.display=currentIdx===questions.length-1?'block':'none';
}

function selectCat(letter,val,labelEl){
  if(!userAnswers[currentIdx]) userAnswers[currentIdx]={};
  userAnswers[currentIdx][letter]=val;
  var box=document.getElementById('cats-'+letter);
  box.querySelectorAll('.cat-label').forEach(function(l){l.classList.remove('selected');});
  labelEl.classList.add('selected');
}

function nextQ(){if(currentIdx<questions.length-1){currentIdx++;showQ();}}
function prevQ(){if(currentIdx>0){currentIdx--;showQ();}}

function showResults(){
  var correct=0;
  var detailsArr=[];
  var rc=document.getElementById('review-container');
  rc.innerHTML='<div class="review-title">\uD83D\uDCDD Разбор ответов</div>';
  
  questions.forEach(function(q,idx){
    var ua=userAnswers[idx]||{};
    var allCorrect=true;
    q.items.forEach(function(item){
      if(ua[item.letter]!==q.answers[item.letter]) allCorrect=false;
    });
    if(allCorrect) correct++;
    
    var chosenStr=q.items.map(function(it){return it.letter+'='+( ua[it.letter]||'?');} ).join(', ');
    var corrStr=q.items.map(function(it){return it.letter+'='+q.answers[it.letter];}).join(', ');
    detailsArr.push({q:q.num,chosen:chosenStr,correct:corrStr,status:allCorrect?'correct':'wrong'});
    
    var div=document.createElement('div');
    div.className='rev-q';
    var headTxt=(allCorrect?'\u2705':'\u274C')+' \u2116'+q.num+'. '+q.text;
    div.innerHTML='<div class="rev-qhead '+(allCorrect?'ok':'fail')+'">'+headTxt+'</div><div class="rev-body"></div>';
    
    var table='<table class="rev-table"><thead><tr><th>Позиция</th><th>Ваш ответ</th><th>Правильно</th></tr></thead><tbody>';
    q.items.forEach(function(item){
      var chosen=ua[item.letter]||'—';
      var corr=q.answers[item.letter];
      var isRight=chosen===corr;
      table+='<tr class="'+(isRight?'right-row':'wrong-row')+'"><td><b>'+item.letter+')</b> '+item.text+'</td>';
      table+='<td>'+(isRight?'\u2705':'')+' '+chosen+' — '+(q.categories[chosen]||'не выбрано')+'</td>';
      table+='<td>\uD83D\uDFE2 '+corr+' — '+q.categories[corr]+'</td></tr>';
    });
    table+='</tbody></table>';
    div.querySelector('.rev-body').innerHTML=table;
    rc.appendChild(div);
  });
  
  var pct=Math.round(correct/questions.length*100);
  document.getElementById('score-circle').textContent=pct+'%';
  document.getElementById('correct-count').textContent=correct+'/'+questions.length;
  var msg='';
  if(pct>=90)msg='Отлично! Превосходный результат!';
  else if(pct>=70)msg='Хорошо! Продолжайте в том же духе!';
  else if(pct>=50)msg='Удовлетворительно. Стоит повторить материал.';
  else msg='Нужно повторить тему.';
  document.getElementById('result-text').textContent=msg;
  
  (function(){
    var name=window._studentName||'Аноним';
    var ts=new Date().toLocaleString('ru-RU');
    fetch('https://script.google.com/macros/s/AKfycbxUNNmmBxwBNHr-hweNoGR8bGDW0CqHNvdSbdG20Sms3UVOiV_8yICDqysOZms-aMH1/exec',{
      method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({name:name,testName:'Политика. Тест 13 (соответствие)',date:ts,score_pct:pct,correct:correct,partial:0,wrong:questions.length-correct,total:questions.length,details:JSON.stringify(detailsArr)})
    }).catch(function(){});
  })();
  
  document.getElementById('question-screen').classList.remove('active');
  document.getElementById('results-screen').classList.add('active');
}
</script>
</body>
</html>
