<style>
:root {
  --primary: #1a5276;
  --primary-light: #2471a3;

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg); min-height:100vh; color:#2c3e50; }
header { background:var(--primary); color:#fff; padding:16px 20px; position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:14px; }

#progress-bar { height:100%; width:0%; background:var(--accent); transition:width .3s; }
.screen { display:none; }
.screen.active { display:block; }
.container { max-width:720px; margin:0 auto; padding:24px 16px 64px; }
.welcome-card { background:var(--card); border-radius:var(--radius); padding:32px 28px; box-shadow:0 2px 12px rgba(0,0,0,.07); text-align:center; }

.name-group { text-align:left; margin-bottom:24px; }
.name-group label { display:block; font-weight:600; margin-bottom:7px; font-size:.92rem; }

.name-group input:focus { border-color:var(--primary-light); }
.btn { display:inline-block; padding:13px 32px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .2s, transform .1s; }
.btn:hover { background:var(--primary-light); }

.q-card.q-correct { border-left-color:var(--success); }
.q-card.q-partial { border-left-color:var(--accent); }

.q-header { display:flex; align-items:flex-start; gap:10px; margin-bottom:12px; }
.q-num { min-width:30px; height:30px; background:var(--bg); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.88rem; color:var(--primary); flex-shrink:0; }
.q-text { font-size:.94rem; line-height:1.55; font-weight:500; }
.options { list-style:none; }
.options li { margin-bottom:7px; }
.option-label { display:flex; align-items:flex-start; gap:9px; padding:9px 12px; border:1.5px solid var(--border); border-radius:7px; cursor:pointer; font-size:.9rem; line-height:1.45; transition:background .15s, border-color .15s; user-select:none; }
.option-label:hover { background:#eaf2fb; border-color:var(--primary-light); }
.option-label.selected { background:#eaf2fb; border-color:var(--primary); }
.res-correct-chosen { background:#d5f5e3 !important; border-color:var(--success) !important; }
.res-wrong-chosen { background:#fde8e8 !important; border-color:var(--danger) !important; }
.res-correct-missed { background:#fef9e7 !important; border-color:var(--accent) !important; }
.q-comment { background:#fef9e7; border-left:3px solid var(--accent); padding:10px 14px; border-radius:0 6px 6px 0; font-size:.85rem; margin-top:10px; line-height:1.5; color:#555; }
.score-circle { width:110px; height:110px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:0 auto 20px; font-size:28px; font-weight:800; color:#fff; }

.score-circle.poor  { background:var(--danger); }

<script>
let userAnswers = {};
let studentName = '';

function initAnswers() {
  userAnswers = {};
  QUESTIONS.forEach(q => { userAnswers[q.num] = []; });
  document.getElementById('q-count').textContent = QUESTIONS.length;
}

function startTest() {
  studentName = document.getElementById('student-name').value.trim();
  if (!studentName) { alert('Пожалуйста, введите ваше имя'); return; }
  initAnswers();
  buildQuestions();
  showScreen('screen-test');
  document.getElementById('total-num').textContent = QUESTIONS.length;
}

function buildQuestions() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  QUESTIONS.forEach(q => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'q-' + q.num;
    const opts = q.options.map((opt, i) => {
      const num = i + 1;
      const letter = String.fromCharCode(64 + num);
      return `<li><label class="option-label" id="lbl-${q.num}-${num}"><input type="checkbox" style="flex-shrink:0;margin-top:2px;" onchange="toggleAnswer(${q.num},${num},this)"> <span>${letter}) ${opt}</span></label></li>`;
    }).join('');
    card.innerHTML = `<div class="q-header"><div class="q-num">${q.num}</div><div class="q-text">${q.text}</div></div><ul class="options">${opts}</ul>`;
    container.appendChild(card);
  });
}

function toggleAnswer(qId, optNum, checkbox) {
  const idx = userAnswers[qId].indexOf(optNum);
  if (idx > -1) userAnswers[qId].splice(idx, 1);
  else userAnswers[qId].push(optNum);
  const lbl = document.getElementById('lbl-' + qId + '-' + optNum);
  if (lbl) lbl.classList.toggle('selected', checkbox.checked);
  document.getElementById('q-' + qId).classList.toggle('answered', userAnswers[qId].length > 0);
  updateProgress();
}

function updateProgress() {
  const answered = QUESTIONS.filter(q => userAnswers[q.num].length > 0).length;
  document.getElementById('answered-num').textContent = answered;
  document.getElementById('progress-bar').style.width = (answered / QUESTIONS.length * 100) + '%';
}

function confirmSubmit() {
  const answered = QUESTIONS.filter(q => userAnswers[q.num].length > 0).length;
  if (answered < QUESTIONS.length) {
    if (!confirm(`Вы ответили на ${answered} из ${QUESTIONS.length} вопросов. Завершить тест?`)) return;
  }
  submitTest();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

function retryTest() {
  showScreen('screen-welcome');
  document.getElementById('student-name').value = '';
}

function submitTest() {
  // Вычислить результат локально
  let correct = 0, partial = 0, wrong = 0;
  QUESTIONS.forEach(q => {
    const s = [...userAnswers[q.num]].sort((a,b)=>a-b);
    const c = [...q.correct].sort((a,b)=>a-b);
    if (JSON.stringify(s) === JSON.stringify(c)) correct++;
    else if (s.some(a => c.includes(a))) partial++;
    else wrong++;
  });
  const score = Math.round(correct / QUESTIONS.length * 100);

  showResults(score, correct, partial, wrong);

  // Отправить в GAS (no-cors, fire-and-forget)
  if (GAS_ENDPOINT && !GAS_ENDPOINT.includes('YOUR_GAS')) {
    fetch(GAS_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        externalTest: true,
        testId: TEST_ID,
        studentName: studentName,
        score: score,
        correctCount: correct,
        wrongCount: wrong,
        totalCount: QUESTIONS.length,
        testTitle: TEST_TITLE,
        blockName: BLOCK_NAME
      })
    })
    .then(() => {
      document.getElementById('send-status').innerHTML = '✅ Результаты сохранены и отправлены преподавателю';
    })
    .catch(() => {
      document.getElementById('send-status').innerHTML = '⚠️ Не удалось отправить (проверьте соединение)';
    });
  } else {
    document.getElementById('send-status').innerHTML = '⚠️ GAS_ENDPOINT не настроен';
  }
}

function showResults(score, correct, partial, wrong) {
  document.getElementById('result-name').textContent = studentName;
  document.getElementById('stat-correct').textContent = '✓ Верно: ' + correct;
  document.getElementById('stat-partial').textContent = '~ Частично: ' + partial;
  document.getElementById('stat-wrong').textContent = '✗ Неверно: ' + wrong;

  const circle = document.getElementById('score-circle');
  circle.innerHTML = `<span>${score}%</span><span class="score-label">результат</span>`;
  circle.className = 'score-circle ' + (score>=80?'great':score>=60?'good':score>=40?'ok':'poor');

  const container = document.getElementById('results-container');
  container.innerHTML = '';
  QUESTIONS.forEach(q => {
    const s = userAnswers[q.num];
    const c = q.correct;
    const ss = [...s].sort((a,b)=>a-b);
    const cs = [...c].sort((a,b)=>a-b);
    let statusClass = 'q-wrong';
    if (JSON.stringify(ss)===JSON.stringify(cs)) statusClass = 'q-correct';
    else if (s.some(a=>c.includes(a))) statusClass = 'q-partial';

    const opts = q.options.map((opt, i) => {
      const n = i+1;
      const isS = s.includes(n), isC = c.includes(n);
      let cls = '';
      if (isS && isC) cls = 'res-correct-chosen';
      else if (isS && !isC) cls = 'res-wrong-chosen';
      else if (!isS && isC) cls = 'res-correct-missed';
      const letter = String.fromCharCode(64+n);
      return `<li><label class="option-label ${cls}"><input type="checkbox" disabled ${isS?'checked':''}> <span>${letter}) ${opt}</span></label></li>`;
    }).join('');

    const card = document.createElement('div');
    card.className = 'q-card ' + statusClass;
    card.innerHTML = `<div class="q-header"><div class="q-num">${q.num}</div><div class="q-text">${q.text}</div></div><ul class="options">${opts}</ul>${q.comment?`<div class="q-comment">${q.comment}</div>`:''}`;
    container.appendChild(card);
  });

  showScreen('screen-results');
}

document.addEventListener('DOMContentLoaded', initAnswers);
</script>
